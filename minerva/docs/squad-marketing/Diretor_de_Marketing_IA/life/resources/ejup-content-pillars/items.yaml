    fact: "Sentença histórica TRT-8, 3ª vara do Trabalho de Parauapebas/PA, juiz Luiz Carlos de Araujo Santos Junior: duas advogadas multadas em R$ 84 mil (10% do valor da causa) por prompt oculto em petição inicial (texto branco sobre fundo branco) instruindo a IA Galileu do tribunal a 'contestar de forma superficial e não impugnar documentos'. Litigância de má-fé, ato atentatório à dignidade da Justiça. OAB-PA suspendeu cautelarmente por 30 dias e enviou ao TED. Primeira condenação do tipo no Brasil."
    source: "Migalhas (455817, 455832, 455971), CNN Brasil, Carta Capital, AASP — todos maio/2026"
    status: active
    captured_at: 2026-05-27
