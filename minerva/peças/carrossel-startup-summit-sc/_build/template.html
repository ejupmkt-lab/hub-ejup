<title>Carrossel Startup Summit</title>
<style id="css">
__FONT_FACES__

/* ============================================================
   TOKENS — mexa só aqui para reskin.
   Peça de perfil PESSOAL (Roberto e Leonardo). Não usa a marca
   EJUP; a gramática visual vem da referência do Sebrae SC
   (chanfro, título em caixa alta com dois pesos, caixa
   contornada com quadrado no canto, etiqueta girada), com
   paleta própria e mais respiro, porque o texto aqui é denso.
   ============================================================ */
:root{
  --paper:#f2efe9;         /* papel quente */
  --paper2:#e9e5dc;        /* um tom abaixo, para ritmo entre telas */
  --ink:#17191b;
  --muted:#5f6469;
  --deep:#12314b;          /* azul profundo: títulos */
  --panel:#0e2237;         /* painel da capa e do fecho */
  --accent:#9a7433;        /* latão: 4,9:1 no papel */
  --rule:rgba(23,25,27,.18);
  --chanfro:58px;          /* corte dos cantos */
  --pad:80px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#23262a;}
body{font-family:'Gotham','Montserrat',system-ui,sans-serif;}

/* ---- a tela ---- */
.slide{
  position:relative; width:1080px; height:1440px; overflow:hidden;
  background:var(--paper); color:var(--ink);
  display:flex; flex-direction:column; padding:var(--pad);
}
.slide.alt{ background:var(--paper2); }

/* ---- título em caixa alta, dois pesos ---- */
.ttl{
  font-size:56px; font-weight:300; line-height:1.04; letter-spacing:-.005em;
  text-transform:uppercase; color:var(--deep); margin:0 0 34px;
}
.ttl b{ font-weight:900; }

/* ---- texto ---- */
.hook{
  font-size:33px; font-weight:400; font-style:italic; line-height:1.38;
  color:var(--ink); margin:0 0 22px;
}
.p{
  font-size:26px; font-weight:300; line-height:1.55; color:var(--muted); margin:0 0 16px;
}
.p:last-of-type{ margin-bottom:0; }
.p em{ font-style:italic; color:var(--ink); }

/* ---- foto com chanfro no canto superior esquerdo ---- */
.shot{
  position:relative; width:100%; overflow:hidden;
  flex:1 1 auto; min-height:380px; max-height:540px;
  margin:34px 0 0; background:#ded9cf;
  clip-path:polygon(var(--chanfro) 0, 100% 0, 100% 100%, 0 100%, 0 var(--chanfro));
}
.shot img{
  position:absolute; left:50%; top:50%; width:100%; height:100%;
  object-fit:cover; transform:translate(-50%,-50%); transform-origin:center center;
  user-select:none; -webkit-user-drag:none;
}
.shot.empty{ background:repeating-linear-gradient(45deg,#e4dfd4 0 20px,#ddd8cc 20px 40px); }

/* ---- caixa contornada, chanfro embaixo à esquerda + quadrado ----
   O contorno é feito com duas camadas recortadas (a de baixo pinta a
   linha, a de cima devolve o fundo): clip-path corta qualquer border. */
.box{ position:relative; margin:34px 0 0; flex:none; }
.box__line, .box__fill{
  clip-path:polygon(0 0, 100% 0, 100% 100%, var(--chanfro) 100%, 0 calc(100% - var(--chanfro)));
}
.box__line{ position:absolute; inset:0; background:var(--accent); }
.box__fill{ position:absolute; inset:2px; background:var(--paper); }
.slide.alt .box__fill{ background:var(--paper2); }
.box__in{ position:relative; padding:44px 48px 48px; }
.kicker{
  font-size:31px; font-weight:400; font-style:italic; line-height:1.38;
  color:var(--deep); margin:0;
}
.box__sq{
  position:absolute; left:0; bottom:-16px; width:30px; height:30px;
  border:5px solid var(--accent); background:var(--paper);
}
.slide.alt .box__sq{ background:var(--paper2); }

/* ---- rodapé ---- */
.foot{
  margin-top:auto; padding-top:34px;
  display:flex; align-items:flex-end; justify-content:space-between; flex:none;
}
.sig{ font-size:19px; font-weight:500; color:var(--deep); }
.sig span{ display:block; font-weight:300; color:var(--muted); font-size:17px; margin-top:5px; }
.num{ font-size:17px; font-weight:500; letter-spacing:.2em; color:var(--muted); }

/* ============================================================
   Capa e fecho: foto sangrando + painel chanfrado por cima
   ============================================================ */
.slide--panel{ padding:0; background:var(--panel); justify-content:flex-end; }
.slide--panel .shot{
  position:absolute; inset:0; width:100%; height:100%; margin:0;
  min-height:0; max-height:none; clip-path:none; border:0;
}
.slide--panel .scrim{ position:absolute; inset:0; background:rgba(8,18,30,.42); }
.painel-wrap{ position:relative; z-index:2; margin:0 56px 56px; }
.painel{
  position:relative; padding:64px 60px 56px;
  background:var(--panel);
  clip-path:polygon(0 0, calc(100% - 88px) 0, 100% 88px, 100% 100%, 0 100%);
  flex:none; display:flex; flex-direction:column;
}
.painel .ttl{ color:#fff; }
.painel .ttl b{ color:#fff; }
.eyebrow{
  font-size:18px; font-weight:500; letter-spacing:.22em; text-transform:uppercase;
  color:#d9bd7e; margin:0 0 28px;
}
.painel .hook{ color:rgba(255,255,255,.92); }
.painel .p{ color:rgba(255,255,255,.72); }
.painel .p em{ color:#fff; }
.painel .box__line{ background:#d9bd7e; }
.painel .box__fill{ background:var(--panel); }
.painel .box__sq{ border-color:#d9bd7e; background:var(--panel); }
.painel .kicker{ color:#e7cf95; }
.painel .sig{ color:#fff; }
.painel .sig span{ color:rgba(255,255,255,.66); }
.painel .num{ color:rgba(255,255,255,.6); }
.painel .foot{ margin-top:34px; }

/* etiqueta girada, como o adesivo da referência */
.tag{
  position:absolute; top:-30px; left:56px; z-index:3;
  transform:rotate(-5deg);
  background:var(--accent); color:#fff;
  font-size:22px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  padding:16px 30px;
  clip-path:polygon(22px 0, 100% 0, 100% 100%, 0 100%, 0 22px);
}

/* ============================================================
   Interface — nada disto entra no PNG nem na impressão.
   ============================================================ */
.hint{
  position:absolute; inset:20px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:12px; text-align:center;
  border:2px dashed rgba(23,25,27,.3); border-radius:8px;
  color:rgba(23,25,27,.6); pointer-events:none;
}
.hint b{ font-size:25px; font-weight:500; }
.hint span{ font-size:18px; font-weight:300; }
.shot.over .hint{ border-color:var(--accent); color:var(--accent); background:rgba(154,116,51,.08); }
.slide--panel .hint{ border-color:rgba(255,255,255,.45); color:rgba(255,255,255,.8); }

.wrap{ max-width:1200px; margin:0 auto; padding:26px 20px 90px; }
.bar{
  position:sticky; top:0; z-index:50; display:flex; flex-wrap:wrap; gap:12px;
  align-items:center; padding:16px 20px; margin-bottom:26px;
  background:#15181b; border:1px solid #2f3338; border-radius:12px;
}
.bar h1{ font-size:17px; font-weight:500; color:#fff; margin:0 auto 0 0; }
.bar small{ display:block; font-weight:300; color:#98a0a7; font-size:14px; margin-top:4px; }
.btn{
  font-family:inherit; font-size:14px; font-weight:500; letter-spacing:.06em;
  text-transform:uppercase; color:#15181b; background:#e0bd79;
  border:0; border-radius:999px; padding:12px 22px; cursor:pointer;
}
.btn.ghost{ background:transparent; color:#e0bd79; border:1px solid #6b5a35; }
.btn:disabled{ opacity:.45; cursor:default; }
.btn:focus-visible,.ui button:focus-visible{ outline:2px solid #e0bd79; outline-offset:2px; }
.ui .st{ color:#7f878e; font-size:12px; }
.card{ margin:0 0 34px; --w:min(540px, calc(100vw - 56px)); }
.frame{ width:var(--w); height:calc(var(--w) * 4 / 3); overflow:hidden;
        box-shadow:0 20px 50px rgba(0,0,0,.45); }
.frame .slide{ transform:scale(var(--k, .5)); transform-origin:top left; }
.ui{ display:flex; align-items:center; gap:12px; width:var(--w); padding:12px 2px 0;
     flex-wrap:wrap;
     color:#98a0a7; font-size:13px; font-weight:300; }
.ui .tg{ font-weight:500; color:#cdd2d6; letter-spacing:.1em; font-size:12px; }
.ui input[type=range]{ flex:1; accent-color:#e0bd79; }
.ui button{
  font-family:inherit; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  background:transparent; color:#98a0a7; border:1px solid #3a3f45;
  border-radius:999px; padding:7px 13px; cursor:pointer;
}
.ui button:hover{ color:#e0bd79; border-color:#6b5a35; }
.row{ display:flex; gap:26px; flex-wrap:wrap; }

@media print{
  html,body{ background:#fff; }
  .bar,.ui,.hint{ display:none !important; }
  .wrap{ max-width:none; margin:0; padding:0; }
  .row{ display:block; }
  .card{ margin:0; }
  .frame{ width:1080px; height:1440px; box-shadow:none; break-after:page; }
  .frame .slide{ transform:none; }
  @page{ size:1080px 1440px; margin:0; }
}
</style>
<div class="wrap">
  <div class="bar">
    <h1>Startup Summit 2026 · Florianópolis
      <small>Arraste uma foto para cada tela, reenquadre arrastando dentro dela e baixe uma a uma.</small></h1>
    <span class="btn ghost" id="modo">verificando…</span>
  </div>
  <div class="row" id="row"></div>
</div>

<script>
/* ============================================================
   CONTEÚDO — o texto vive aqui.
   titulo = caixa alta, <b> marca a parte em peso pesado
   hook   = linha de abertura (itálico)
   p      = corpo, um item por parágrafo
   kicker = linha de fecho, dentro da caixa contornada
   ============================================================ */
const CONTEUDO = [
  { painel:true,
    eyebrow:"Startup Summit 2026 · Florianópolis",
    titulo:"<b>O que sustenta</b> as empresas que crescem",
    hook:"Talvez o maior erro seja olhar para empresas extraordinárias como se elas crescessem sozinhas.",
    p:["Em Santa Catarina, fomos entender o que existe por trás de negócios que conseguem inovar, escalar e continuar abrindo novas frentes."],
    kicker:"E a resposta começa justamente onde a empresa termina.",
    tag:"12 leituras" },

  { titulo:"<b>O território</b>",
    hook:"Nossa primeira agenda foi com o prefeito de Florianópolis.",
    p:["E a discussão começou pelo território.",
       "Empresas que dependem de talento qualificado dependem também do território — porque profissionais qualificados escolhem onde querem viver, trabalhar e construir o futuro."],
    kicker:"Competitividade também se constrói fora dos limites da empresa." },

  { titulo:"<b>A reforma</b> tributária",
    hook:"A Reforma Tributária tende a tornar essa disputa ainda mais sofisticada.",
    p:["Com o IBS no destino e a redução progressiva do espaço para a antiga lógica de benefícios de ICMS e ISS, parte relevante da velha guerra fiscal perde força.",
       "Os territórios continuarão competindo."],
    kicker:"Mas cada vez mais pela capacidade real de oferecer infraestrutura, talento, ambiente de negócios, inovação e qualidade institucional." },

  { titulo:"<b>Audaces</b>",
    hook:"Na Audaces, vimos que um mercado pode começar a ser construído antes mesmo da venda.",
    p:["A aproximação com instituições de ensino insere a tecnologia no repertório do profissional ainda durante sua formação.",
       "Quando ele chega ao mercado, a relação com aquela solução já começou."],
    kicker:"Formar usuário também pode ser estratégia de formação de mercado." },

  { titulo:"<b>IA</b> na operação",
    hook:"Na mesma visita, a IA apareceu como parte da economia do próprio negócio.",
    p:["Não apenas para acelerar tarefas.",
       "Mas para interferir em produtividade, precisão, desperdício e custo de produção."],
    kicker:"O valor da tecnologia começa quando ela altera uma variável econômica relevante da operação." },

  { titulo:"<b>RD Station</b> e Zoho",
    hook:"RD Station e Zoho nos fizeram pensar sobre a profundidade da relação com o cliente.",
    p:["Na Zoho, diferentes necessidades de uma empresa são atendidas dentro de um mesmo ecossistema de soluções.",
       "O cliente muda. Os problemas mudam. A relação permanece."],
    kicker:"Talvez escalar também seja aprender a crescer junto com quem compra de você." },

  { titulo:"<b>Delivery Much</b>",
    hook:"Na Delivery Much, a inovação estava no desenho do modelo.",
    p:["Uma alteração na lógica tradicional de franquias permitiu alcançar um mercado que a estrutura convencional deixava de fora.",
       "E isso muda a pergunta:"],
    kicker:"quantas oportunidades parecem inexistentes apenas porque ainda estão sendo observadas pelo modelo errado?" },

  { titulo:"<b>SENAI</b>",
    hook:"No SENAI, a discussão avançou da leitura de tendências para a formação de novas percepções de valor.",
    p:["Um dos exemplos apresentados envolveu movimentos da JBS em torno de novos atributos associados à carne.",
       "Empresas sofisticadas não apenas respondem ao que o mercado já demanda."],
    kicker:"Algumas também ajudam a construir aquilo que o mercado aprenderá a valorizar." },

  { titulo:"<b>Softplan</b> e Estação Pública",
    hook:"Vimos outra camada do ecossistema: a aproximação entre inovação e Estado.",
    p:["A Softplan constrói soluções para problemas complexos do setor público.",
       "A Estação Pública amplia essa lógica ao aproximar gestores, govtechs, empresas e especialistas."],
    kicker:"Quando o problema e a capacidade de resolvê-lo não se encontram por acaso, alguém precisa desenhar essa conexão." },

  { titulo:"<b>O Direito</b> na arquitetura",
    hook:"E é justamente aí que o Direito deixa de ser apenas suporte e passa a fazer parte da arquitetura.",
    p:["Quanto mais empresas, instituições e interesses passam a operar de forma interdependente, mais relevantes se tornam governança, contratos, propriedade intelectual, regulação e segurança institucional."],
    kicker:"Ecossistemas crescem por conexão — mas permanecem de pé por estrutura." },

  { titulo:"<b>A densidade</b> das relações",
    hook:"Ao final, o que mais nos chamou atenção não foi um case isolado.",
    p:["Foi a densidade das relações.",
       "Empresas. Universidades. Indústria. Poder público. Capital. Formação. Tecnologia. Talentos."],
    kicker:"Um ecossistema amadurece quando essas conexões deixam de depender do acaso e passam a fazer parte da própria infraestrutura do ambiente." },

  { painel:true, fim:true,
    eyebrow:"O que trouxemos de volta",
    titulo:"<b>Conectados</b> o suficiente para crescerem juntos",
    p:["Voltamos de Santa Catarina menos interessados em reproduzir empresas — e mais interessados em compreender <em>as relações que tornam possível o crescimento delas.</em>",
       "Porque construir um ecossistema não é simplesmente reunir bons negócios. É fazer com que capacidades diferentes se reforcem sem perder autonomia."],
    kicker:"Negócios independentes o suficiente para terem identidade própria — e conectados o suficiente para crescerem juntos.",
    tag:"Obrigado, SC" },
];

const ASSINATURA = "Roberto Pivotto · Leonardo Pivotto";
const TOTAL = CONTEUDO.length;
const estado = CONTEUDO.map(() => ({ src:null, scale:1, x:0, y:0 }));
const row = document.getElementById('row');

function caixa(kicker){
  return '<div class="box"><div class="box__line"></div><div class="box__fill"></div>' +
         '<div class="box__in"><p class="kicker">' + kicker + '</p></div>' +
         '<div class="box__sq"></div></div>';
}
function foto(i){
  return '<div class="shot empty" data-drop="' + i + '">' +
           '<div class="hint" data-ui="1"><b>Arraste a foto aqui</b>' +
           '<span>ou clique para escolher</span></div></div>';
}
function rodape(i, assina){
  return '<div class="foot"><div class="sig">' + (assina ? ASSINATURA : '') +
         (assina ? '<span>Startup Summit 2026 · Florianópolis</span>' : '') + '</div>' +
         '<div class="num">' + String(i + 1).padStart(2, '0') + ' — ' + TOTAL + '</div></div>';
}

CONTEUDO.forEach((c, i) => {
  const card = document.createElement('div'); card.className = 'card';
  const frame = document.createElement('div'); frame.className = 'frame';
  const s = document.createElement('section');
  s.className = 'slide' + (c.painel ? ' slide--panel' : (i % 2 ? ' alt' : ''));
  s.dataset.i = i;

  const corpo =
    (c.eyebrow ? '<p class="eyebrow">' + c.eyebrow + '</p>' : '') +
    '<h2 class="ttl">' + c.titulo + '</h2>' +
    (c.hook ? '<p class="hook">' + c.hook + '</p>' : '') +
    c.p.map(t => '<p class="p">' + t + '</p>').join('');

  s.innerHTML = c.painel
    ? foto(i) + '<div class="scrim"></div>' +
      '<div class="painel-wrap"><div class="painel">' + corpo + caixa(c.kicker) +
        rodape(i, true) + '</div>' +
        (c.tag ? '<div class="tag">' + c.tag + '</div>' : '') + '</div>'
    : corpo + foto(i) + caixa(c.kicker) + rodape(i, false);

  frame.appendChild(s);

  const ui = document.createElement('div'); ui.className = 'ui';
  ui.innerHTML = '<span class="tg">' + String(i + 1).padStart(2, '0') + '</span>' +
    '<input type="range" min="1" max="3" step="0.01" value="1" title="Zoom">' +
    '<button data-act="troca">Trocar</button>' +
    '<button data-act="limpa">Limpar</button>' +
    '<button data-act="png">Baixar PNG</button>' +
    '<span class="st"></span>';

  card.appendChild(frame); card.appendChild(ui); row.appendChild(card);

  ligarFoto(s.querySelector('.shot'), i);
  ui.querySelector('input').addEventListener('input', e => {
    estado[i].scale = parseFloat(e.target.value); aplicar(i);
  });
  ui.addEventListener('click', e => {
    const a = e.target.dataset.act;
    if (a === 'troca') escolher(i);
    if (a === 'limpa') { estado[i] = { src:null, scale:1, x:0, y:0 };
                         ui.querySelector('input').value = 1; aplicar(i); }
    if (a === 'png') baixar(i, ui.querySelector('.st'));
  });
});

/* ---------- foto: soltar, escolher, arrastar para reenquadrar ---------- */
function ligarFoto(shot, i){
  ['dragenter','dragover'].forEach(ev =>
    shot.addEventListener(ev, e => { e.preventDefault(); shot.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev =>
    shot.addEventListener(ev, () => shot.classList.remove('over')));
  shot.addEventListener('drop', e => {
    e.preventDefault();
    const f = [...e.dataTransfer.files].find(x => x.type.startsWith('image/'));
    if (f) carregar(f, i);
  });
  shot.addEventListener('click', () => { if (!estado[i].src) escolher(i); });

  let arrasta = false, px = 0, py = 0;
  shot.addEventListener('mousedown', e => {
    if (!estado[i].src) return;
    arrasta = true; px = e.clientX; py = e.clientY; e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!arrasta) return;
    // a moldura é responsiva: converte o passo do mouse para a escala real
    const k = shot.closest('.frame').clientWidth / 1080 || 1;
    estado[i].x += (e.clientX - px) / k; estado[i].y += (e.clientY - py) / k;
    px = e.clientX; py = e.clientY; aplicar(i);
  });
  window.addEventListener('mouseup', () => { arrasta = false; });
}

function escolher(i){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => { if (inp.files[0]) carregar(inp.files[0], i); };
  inp.click();
}
function carregar(file, i){
  const r = new FileReader();
  r.onload = () => { estado[i] = { src:r.result, scale:1, x:0, y:0 }; aplicar(i); };
  r.readAsDataURL(file);
}
function aplicar(i){
  const shot = document.querySelector('.slide[data-i="' + i + '"] .shot');
  const st = estado[i];
  let img = shot.querySelector('img');
  if (!st.src) {
    if (img) img.remove();
    shot.classList.add('empty');
    shot.querySelector('.hint').style.display = '';
    return;
  }
  if (!img) { img = new Image(); shot.insertBefore(img, shot.firstChild); }
  img.src = st.src;
  img.style.transform = 'translate(calc(-50% + ' + st.x + 'px), calc(-50% + ' + st.y +
                        'px)) scale(' + st.scale + ')';
  shot.classList.remove('empty');
  shot.querySelector('.hint').style.display = 'none';
}

/* ---------- exportação ----------
   PNG por SVG + foreignObject: a tela é serializada com o próprio CSS
   (fontes já em base64) e desenhada num canvas 1080×1440. Sem biblioteca
   externa, porque a peça precisa rodar offline. */
function slideParaSVG(slide){
  const XHTML = 'http://www.w3.org/1999/xhtml';
  const clone = slide.cloneNode(true);
  clone.removeAttribute('data-i');
  clone.querySelectorAll('[data-ui]').forEach(n => n.remove());
  clone.setAttribute('xmlns', XHTML);
  const style = document.createElementNS(XHTML, 'style');
  style.textContent = document.getElementById('css').textContent;
  const wrap = document.createElementNS(XHTML, 'div');
  wrap.setAttribute('xmlns', XHTML);
  wrap.appendChild(style); wrap.appendChild(clone);
  return '<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440">' +
         '<foreignObject x="0" y="0" width="1080" height="1440">' +
         new XMLSerializer().serializeToString(wrap) +
         '</foreignObject></svg>';
}

/* O PNG é gerado no navegador e entregue de dois jeitos: dentro do artifact,
   pela capacidade "downloads" (o visitante confirma o salvamento — a página
   não pode baixar sozinha); fora dele, por link comum. */
const dlPromise = (window.claude && window.claude.use)
  ? Promise.resolve(window.claude.use('downloads')).catch(() => null)
  : Promise.resolve(null);

dlPromise.then(dl => {
  document.getElementById('modo').textContent =
    dl ? 'Download tela a tela' : 'Download direto';
});

function pngBlob(i){
  return new Promise((ok, falha) => {
    const slide = document.querySelector('.slide[data-i="' + i + '"]');
    const url = URL.createObjectURL(
      new Blob([slideParaSVG(slide)], { type:'image/svg+xml;charset=utf-8' }));
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = 1080; cv.height = 1440;
      cv.getContext('2d').drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      cv.toBlob(b => b ? ok(b) : falha(new Error('canvas vazio')), 'image/png');
    };
    img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('svg')); };
    img.src = url;
  });
}

async function baixar(i, st){
  const nome = 'tela-' + String(i + 1).padStart(2, '0') + '.png';
  st.textContent = 'Gerando…';
  let blob;
  try { blob = await pngBlob(i); }
  catch (_) { st.textContent = 'Não consegui gerar esta tela.'; return; }

  const dl = await dlPromise;
  if (!dl) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nome; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    st.textContent = 'Baixado.';
    return;
  }
  try {
    await dl.save({ filename: nome, data: blob });
    st.textContent = 'Salvo.';
  } catch (e) {
    const c = e && e.code;
    if (c === 'declined') { st.textContent = ''; return; }
    st.textContent = c === 'rate_limited'
      ? 'Espere um instante e tente de novo.'
      : 'Não deu para salvar aqui.';
  }
}

</script>
