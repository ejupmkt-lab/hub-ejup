<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Carrossel — EJUPcast 018</title>
<style>
__FONT_FACES__
:root{--tinta:#0d131a;--navy:#031c37;--aco:#304557;--grafite:#414042;--cinza:#5f6062;
  --prata:#d1d3d4;--ouro:#f0b855;--bronze:#9b6b26;--papel:#ecebe7}
*{box-sizing:border-box;margin:0}
html,body{background:#3a3d42}
body{display:flex;flex-wrap:wrap;gap:28px;padding:28px;font-family:'Gotham',sans-serif}
.s{position:relative;width:1080px;height:1440px;overflow:hidden}
.papel{background:var(--papel);color:var(--navy)}
.tinta{background:var(--navy);color:#f3f1ec}
.facetas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* capa */
.capa{background:var(--navy);color:#f3f1ec}
.capa-foto{position:absolute;right:0;top:230px;width:560px;height:840px;background-size:cover;
  background-position:55% 20%;z-index:2}
.capa-logo{position:absolute;left:64px;top:72px;z-index:3;display:flex;align-items:flex-end;gap:10px}
.capa-logo svg,.cartao-logo svg{width:190px;height:auto;display:block}
.capa-logo svg path,.cartao-logo svg path{fill:#fff!important}
.capa-logo span,.cartao-logo span{font-weight:300;font-size:38px;letter-spacing:.02em;color:#fff;line-height:1}
.ep{position:absolute;left:64px;top:330px;z-index:3;font-weight:400;font-size:26px;letter-spacing:.1em}
.numero{position:absolute;left:48px;top:360px;z-index:3;font-weight:200;font-size:250px;letter-spacing:-.05em;line-height:1}
.nomes{position:absolute;left:64px;bottom:170px;z-index:4;font-weight:300;font-size:118px;line-height:.98;
  letter-spacing:-.04em;color:#f3f1ec;text-shadow:0 4px 30px rgba(3,28,55,.55)}
.nomes em{font-style:normal;color:var(--ouro)}
.capa-gancho{position:absolute;right:64px;bottom:84px;z-index:4;text-align:right;font-weight:500;
  font-size:26px;line-height:1.3;color:var(--ouro)}
.capa-simb{position:absolute;left:64px;bottom:72px;z-index:4;width:64px;opacity:.9}

/* temas */
.temas{position:absolute;left:64px;top:110px;font-weight:500;font-size:104px;line-height:.96;
  letter-spacing:-.03em;color:var(--navy)}
.lateral{position:absolute;right:40px;top:110px;writing-mode:vertical-rl;font-weight:500;font-size:18px;
  letter-spacing:.2em;color:var(--cinza)}
.arco{position:absolute;left:0;right:0;bottom:0;height:420px;clip-path:ellipse(75% 100% at 50% 100%)}
.temas-rod{position:absolute;left:64px;bottom:470px;font-weight:400;font-size:28px;color:var(--grafite)}

/* frases */
.aspas{position:absolute;left:56px;top:40px;font-weight:900;font-size:240px;line-height:1;color:var(--bronze)}
.tinta .aspas{color:var(--ouro)}
.frase{position:absolute;left:72px;right:88px;top:250px;font-weight:400;line-height:1.1;letter-spacing:-.03em}
.frase em{font-style:italic;color:var(--bronze)}
.tinta .frase em{color:var(--ouro)}
.autor{position:absolute;left:72px;top:1180px;font-weight:500;font-size:30px;display:flex;gap:18px;align-items:baseline}
.autor span{font-weight:400;font-size:20px;letter-spacing:.14em;color:var(--cinza)}
.tinta .autor span{color:var(--prata)}
.banda{position:absolute;left:0;right:0;bottom:0;overflow:hidden}
.banda-foto{position:absolute;inset:0;background-size:cover;background-position:center}
.banda-foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,28,55,.25),rgba(3,28,55,0) 40%)}
.s:has(.banda) .autor{top:830px}
.s:has(.banda) .frase{top:210px}
.seta{position:absolute;right:64px;bottom:64px;z-index:5;width:120px;height:62px;border:2px solid var(--bronze);
  border-radius:31px;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--bronze)}
.tinta .seta,.s:has(.banda) .seta{border-color:var(--ouro);color:var(--ouro);background:rgba(3,28,55,.55)}

/* cartão */
.cartao-topo{position:absolute;left:40px;right:40px;top:40px;height:460px;border-radius:24px;overflow:hidden}
.cartao-logo{position:absolute;left:52px;top:48px;display:flex;align-items:flex-end;gap:10px}
.cartao-foto{position:absolute;left:112px;top:330px;width:460px;height:360px;border-radius:24px;
  background-size:cover;background-position:center;box-shadow:0 24px 50px rgba(3,28,55,.35)}
.cartao-tit{position:absolute;left:112px;top:730px;right:80px;font-weight:900;font-size:64px;line-height:1.02;
  letter-spacing:-.03em;color:var(--navy)}
.cartao-tit span{display:block;font-weight:400;font-size:44px;color:var(--cinza);margin-bottom:10px}
.bio{position:relative;margin-left:112px;margin-right:100px;font-weight:300;font-size:25px;line-height:1.45;color:var(--grafite)}
.bio b{font-weight:500;color:var(--navy)}
.bio:first-of-type{margin-top:990px}
.bio+.bio{margin-top:18px}
.bio.mini{font-size:22px;color:var(--cinza)}
.play{position:absolute;right:80px;top:440px;background:var(--navy);color:var(--ouro);font-weight:500;
  font-size:30px;padding:24px 44px;border-radius:999px;display:flex;gap:16px;align-items:center}

/* onde assistir */
.cta{background:var(--navy);color:#f3f1ec}
.cta-foto{position:absolute;left:0;right:0;bottom:0;height:620px;background-size:cover;background-position:50% 35%;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 18%);mask-image:linear-gradient(180deg,transparent,#000 18%)}
.cta-tit{position:absolute;left:64px;top:100px;font-weight:300;font-size:120px;line-height:.98;letter-spacing:-.04em;z-index:2}
.cta-tit em{font-style:italic;font-weight:400;color:var(--ouro)}
.canais{position:absolute;left:64px;top:560px;z-index:2}
.canais p{font-weight:500;font-size:48px;line-height:1.1;margin-bottom:24px}
.canais small{display:block;font-weight:400;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--prata)}
.pergunta{position:absolute;right:64px;top:600px;text-align:right;font-weight:400;font-size:38px;line-height:1.25;z-index:2}
.pergunta em{font-style:italic;color:var(--ouro)}
.cta-logo{position:absolute;right:64px;bottom:64px;width:200px;z-index:3}
.cta-logo svg{width:100%;height:auto;display:block}
.cta-logo path{fill:#fff!important}
</style></head>
<body>
__SLIDES__
</body></html>
