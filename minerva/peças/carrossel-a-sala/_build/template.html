<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Carrossel — A Sala</title>
<style>
__FONT_FACES__
:root{--tinta:#0d131a;--navy:#031c37;--grafite:#414042;--cinza:#5f6062;
  --prata:#d1d3d4;--ouro:#f0b855;--bronze:#9b6b26;--papel:#f3f1ec}
*{box-sizing:border-box;margin:0}
html,body{background:#3a3d42}
body{display:flex;flex-wrap:wrap;gap:28px;padding:28px;font-family:'Gotham',sans-serif}

.s{position:relative;width:1080px;height:1440px;overflow:hidden}
/* grão de película em todas as telas */
.s::after{content:"";position:absolute;inset:0;z-index:30;pointer-events:none;opacity:.22;
  mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.tinta{background:var(--tinta);color:#f3f1ec}
.preto{background:#000;color:#f3f1ec}
.papel{background:var(--papel);color:var(--tinta)}
.papel.s::after{opacity:.3;mix-blend-mode:multiply}

/* imagens */
.cheia{position:absolute;inset:0;background-size:cover;background-position:center}
.quadro{position:absolute;background-size:cover;background-position:center}
.sombra-baixo{position:absolute;left:0;right:0;bottom:0;height:760px;
  background:linear-gradient(180deg,transparent,rgba(5,8,12,.88) 62%,#05080c)}
.tarja{position:absolute;left:0;right:0;height:190px;background:#000;z-index:2}
.tarja.cima{top:0}.tarja.baixo{bottom:0}

/* tipografia de exibição: Book com itálico */
.disp{position:absolute;z-index:5;font-weight:400;font-size:118px;line-height:.98;
  letter-spacing:-.04em}
.disp em{font-style:italic;font-weight:400;letter-spacing:-.035em}
.disp.centro{left:60px;right:60px;top:50%;transform:translateY(-52%);text-align:center}
.disp.menor{font-size:84px}
.disp.gigante{font-size:230px;letter-spacing:-.05em}
.tinta .disp em,.preto .disp em{color:#fff}

/* rótulos e legendas miúdas */
.lab,.leg{position:absolute;z-index:6;font-weight:400;font-size:22px;line-height:1.35;letter-spacing:.005em}
.leg{max-width:520px}
.leg.larga{max-width:700px}
.dir{text-align:right}
.tl{left:60px;top:60px}.tr{right:60px;top:60px}
.bl{left:60px;bottom:64px}.br{right:60px;bottom:64px}
.tc{left:0;right:0;top:64px;text-align:center}
.bc{left:0;right:0;bottom:90px;margin:0 auto;text-align:center}
.sobre{z-index:6;color:#e8e4da}
.ouro{color:var(--ouro)}
.papel .lab,.papel .leg{color:var(--tinta)}

/* marcações sobre a imagem */
.marca{position:absolute;z-index:6;font-weight:500;font-size:17px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ouro);display:flex;align-items:center;gap:12px}
.marca::before{content:"";width:12px;height:12px;border:2px solid var(--ouro);border-radius:50%}

/* legenda de cinema */
.legenda{position:absolute;z-index:6;left:60px;right:60px;bottom:250px;text-align:center;
  font-weight:400;font-size:44px;line-height:1.3;color:#f5efdc;
  text-shadow:0 2px 4px #000,0 0 24px rgba(0,0,0,.9)}

/* roteiro */
.roteiro .pagina{position:absolute;left:150px;right:150px;top:220px;bottom:140px;
  border-top:1px solid rgba(13,19,26,.25);padding-top:60px}
.roteiro p{font-size:30px;line-height:1.5;color:var(--tinta)}
.roteiro .slug{font-weight:500;letter-spacing:.06em}
.roteiro .acao{margin-top:34px;font-weight:300}
.roteiro .pers{margin-top:46px;text-align:center;font-weight:500;letter-spacing:.12em}
.roteiro .fala{margin:10px 40px 0;text-align:center;font-weight:400}
.roteiro .paren{margin-top:10px;text-align:center;font-style:italic;color:var(--cinza)}
.roteiro .trans{margin-top:56px;text-align:right;font-weight:500;letter-spacing:.1em;color:var(--bronze)}

/* película */
.pelicula{position:absolute;left:70px;top:70px;bottom:70px;width:420px;background:#161616;
  display:flex;flex-direction:column;justify-content:center;gap:34px;padding:0 70px}
.pelicula .fr{height:290px;background-size:cover;background-position:center}
.furos{position:absolute;top:30px;bottom:30px;width:24px;display:flex;flex-direction:column;justify-content:space-between}
.furos.e{left:22px}.furos.d{right:22px}
.furos i{display:block;height:34px;border-radius:5px;background:#000}

.creditos{position:absolute;z-index:6;left:0;right:0;bottom:190px;text-align:center;
  font-weight:500;font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:var(--prata);opacity:.7}
.tinta .creditos{bottom:200px}

.logo{position:absolute;z-index:6;width:170px}
.logo svg{width:100%;height:auto;display:block}
.logo.br{right:60px;bottom:60px}
.logo.bc{left:0;right:0;margin:0 auto;bottom:84px}
.tinta .logo path,.preto .logo path{fill:#fff!important}
</style></head>
<body>
__SLIDES__
</body></html>
