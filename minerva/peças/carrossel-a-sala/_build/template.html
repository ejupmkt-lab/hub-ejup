<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Carrossel — A Sala</title>
<style>
__FONT_FACES__
:root{--tinta:#0d131a;--navy:#031c37;--grafite:#414042;--cinza:#5f6062;
  --prata:#d1d3d4;--ouro:#f0b855;--bronze:#9b6b26;--papel:#ece8df}
*{box-sizing:border-box;margin:0}
html,body{background:#3a3d42}
body{display:flex;flex-wrap:wrap;gap:28px;padding:28px;font-family:'Gotham',sans-serif}

.s{position:relative;width:1080px;height:1440px;overflow:hidden}
.s::after{content:"";position:absolute;inset:0;z-index:40;pointer-events:none;opacity:.24;
  mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.tinta{background:var(--tinta);color:#f3f1ec}
.papel{background:var(--papel);color:var(--tinta)}
.papel.s::after{opacity:.34;mix-blend-mode:multiply}

.cheia{position:absolute;inset:0;background-size:cover;background-position:center}
.quadro{position:absolute;background-size:cover;background-position:center;z-index:1}
.grad-baixo{position:absolute;left:0;right:0;bottom:0;height:820px;z-index:1;
  background:linear-gradient(180deg,transparent,rgba(8,12,18,.82) 55%,rgba(8,12,18,.96))}
.grad-cima{position:absolute;left:0;right:0;top:0;height:760px;z-index:1;
  background:linear-gradient(0deg,transparent,rgba(8,12,18,.78) 50%,rgba(8,12,18,.94))}

/* exibição */
.disp{position:absolute;z-index:5;font-weight:400;font-size:118px;line-height:.98;letter-spacing:-.04em}
.disp em{font-style:italic;letter-spacing:-.03em}
.tinta .disp em{color:var(--ouro)}
.papel .disp em{color:var(--bronze)}
.centro-y{top:50%;transform:translateY(-50%)}
.centro-x{left:0;right:0;margin:0 auto;text-align:center}

.lab,.leg{position:absolute;z-index:6;font-weight:400;font-size:24px;line-height:1.38}
.lab{font-weight:500;font-size:18px;letter-spacing:.2em;line-height:1.5}
.tinta .lab{color:rgba(243,241,236,.78)}
.papel .lab{color:var(--grafite)}
.tinta .leg{color:#f3f1ec}
.dir{text-align:right}
.seta{position:absolute;z-index:6;font-size:44px;line-height:1;color:var(--ouro)}

.marca{position:absolute;z-index:6;font-weight:500;font-size:18px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ouro);display:flex;align-items:center;gap:12px;
  background:rgba(8,12,18,.78);padding:10px 16px}
.marca::before{content:"";width:12px;height:12px;border:2px solid var(--ouro);border-radius:50%}

/* capa no estilo cartaz editorial */
.capa .titulo{position:absolute;z-index:3;left:0;right:0;top:268px;text-align:center;
  font-weight:900;font-size:430px;line-height:.8;letter-spacing:-.06em;color:var(--tinta)}
.capa .cadeira{position:absolute;inset:0;width:1080px;height:1440px;z-index:4}
.capa .gancho{position:absolute;z-index:5;left:0;right:0;top:140px;text-align:center;
  font-weight:500;font-size:46px;line-height:1.16;letter-spacing:-.02em;color:var(--tinta)}
.capa .gancho em{font-style:italic;font-weight:400;color:var(--bronze)}
.micro{position:absolute;z-index:6;font-weight:500;font-size:14px;letter-spacing:.14em;
  line-height:1.35;text-transform:uppercase;color:var(--tinta)}
.papel .micro{color:var(--tinta)}
.c{position:absolute;z-index:6;width:44px;height:44px;border-color:var(--tinta);border-style:solid;border-width:0}
.c1{left:52px;top:52px;border-left-width:2px;border-top-width:2px}
.c2{right:52px;top:52px;border-right-width:2px;border-top-width:2px}
.c3{left:52px;bottom:52px;border-left-width:2px;border-bottom-width:2px}
.c4{right:52px;bottom:52px;border-right-width:2px;border-bottom-width:2px}

.logo{position:absolute;z-index:6;width:180px}
.logo svg{width:100%;height:auto;display:block}
.logo.bc{left:0;right:0;margin:0 auto;bottom:70px}
.tinta .logo path{fill:#fff!important}
</style></head>
<body>
__SLIDES__
</body></html>
