<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
__FONTS__
*{box-sizing:border-box}body{margin:0;background:#333}
.capa{position:relative;width:1080px;height:1440px;overflow:hidden;background:#04101c;
  font-family:'Gotham',system-ui,sans-serif;color:#fff}
.foto{position:absolute;inset:0}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(4,16,28,.25) 0%,rgba(4,16,28,.15) 38%,rgba(4,16,28,.86) 66%,#04101c 100%)}
.texto{position:absolute;left:80px;right:80px;bottom:196px;z-index:2}
.pergunta{margin:0;font-weight:900;font-size:104px;line-height:1.0;letter-spacing:-.03em}
.pergunta .g{color:#f0b855;display:block}
.sub{margin:34px 0 0;font-weight:300;font-size:31px;line-height:1.5;color:rgba(209,211,212,.92);max-width:880px}
.fonte{margin:34px 0 0;font-weight:500;font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:rgba(240,184,85,.85);line-height:1.6}
.cta{position:absolute;left:80px;bottom:78px;z-index:2;display:inline-flex;align-items:center;gap:14px;
  padding:18px 26px;border-radius:999px;border:2px solid #f0b855;font-weight:500;font-size:24px;color:#fff}
.cta i{font-style:normal;color:#f0b855;font-size:28px;line-height:1}
.logo{position:absolute;right:80px;bottom:82px;z-index:2;width:220px}
.logo svg{width:100%;height:auto;display:block}
</style></head><body>
<section class="capa">
  <div class="foto"><img src="__FOTO__" alt=""></div>
  <div class="texto">
    <h1 class="pergunta">Quem julga <span class="g">um ministro do STF?</span></h1>
    <p class="sub">A responsabilização existe no ordenamento brasileiro. O artigo mostra os mecanismos, quem pode acioná-los e onde cada caminho termina.</p>
    <p class="fonte">Coluna Jurídica · a partir do EJUPcast #018<br>com Nicácio Carvalho e Eduardo Pacheco</p>
  </div>
  <div class="cta"><i>&rarr;</i>Leia o artigo completo, link na bio</div>
  <div class="logo">__LOGO__</div>
</section>
</body></html>
