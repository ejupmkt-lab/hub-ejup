<title>Minerva</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
__FONTS__
:root{--navy:#031c37;--gold:#f0b855;--silver:#d1d3d4}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 40%,#0a2a49 0%,#061a30 45%,#04101c 100%);
  color:var(--silver);font-family:'Gotham','Montserrat',system-ui,sans-serif;font-weight:300;
  min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:20px 16px calc(16px + env(safe-area-inset-bottom));overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;max-width:760px;width:100%;margin:0 auto;gap:8px}
header .nome{font-weight:900;font-size:18px;letter-spacing:-.02em;color:#fff}
header .nome small{display:block;font-weight:500;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(209,211,212,.5);margin-top:3px}
header .acoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;font-weight:500;font-size:12px;letter-spacing:.04em;color:var(--silver);background:transparent;
  border:1px solid rgba(209,211,212,.28);border-radius:4px;padding:8px 11px;cursor:pointer}
button:hover{border-color:var(--gold);color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button[aria-pressed="true"]{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.palco{display:grid;place-items:center;position:relative;min-height:0}
#orb{width:min(66vmin,420px);height:min(66vmin,420px);cursor:pointer;display:block;filter:drop-shadow(0 0 40px rgba(240,184,85,.10))}
.estado{position:absolute;bottom:6%;left:0;right:0;text-align:center;font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(240,184,85,.8)}
.dica{position:absolute;top:4%;left:0;right:0;text-align:center;font-size:15px;color:rgba(209,211,212,.7);padding:0 12px}
.legenda{max-width:720px;width:100%;margin:0 auto;min-height:112px;display:flex;flex-direction:column;gap:8px;text-align:center}
.legenda .voce{font-size:14px;color:rgba(209,211,212,.55)}
.legenda .voce::before{content:"Você  ";font-weight:500;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(209,211,212,.4)}
.legenda .ela{font-size:18px;line-height:1.5;color:#fff;text-wrap:balance}
.legenda .erro{font-size:13px;color:var(--gold)}
.teclado{display:none;gap:8px;max-width:720px;width:100%;margin:10px auto 0}
.teclado.aberto{display:flex}
.teclado input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 14px;border-radius:4px;border:1px solid rgba(209,211,212,.28);background:rgba(255,255,255,.04);color:#fff}
.teclado input:focus{outline:2px solid var(--gold);outline-offset:1px}
</style>

<header>
  <div class="nome">Minerva<small>EJUP · protótipo por voz</small></div>
  <div class="acoes">
    <button id="demo" title="Ver o ciclo sem gastar nada">Demonstração</button>
    <button id="mudo" aria-pressed="true" title="Voz dela ligada">Voz</button>
    <button id="btnTeclado" title="Escrever em vez de falar">Teclado</button>
    <button id="nova">Nova conversa</button>
  </div>
</header>

<section class="palco">
  <div class="dica" id="dica">Toque no círculo e fale</div>
  <canvas id="orb" width="840" height="840" role="button" aria-label="Falar com a Minerva"></canvas>
  <div class="estado" id="estado"></div>
</section>

<section class="legenda" id="legenda">
  <div class="voce" id="voce" hidden></div>
  <div class="ela" id="ela"></div>
  <div class="erro" id="erro" hidden></div>
</section>
<form class="teclado" id="teclado"><input id="entrada" placeholder="Escreva para a Minerva" autocomplete="off"><button type="submit">Enviar</button></form>

<script>
const BASE = __KB__;
const INSTRUCOES = BASE + `

## MODO VOZ
Você está falando em voz alta, por síntese de fala. Responda como quem fala:
frases curtas, sem listas, sem markdown, sem símbolos, sem cabeçalhos.
Duas a cinco frases, salvo pedido de detalhe. Nada de travessão entre
palavras. Nada de "não é X, é Y".`;

const $ = s => document.querySelector(s);
const orb = $('#orb'), cx = orb.getContext('2d');
const estadoEl = $('#estado'), dica = $('#dica'), voceEl = $('#voce'), elaEl = $('#ela'), erroEl = $('#erro');
let fase = 'parada', turnos = [], ligada = false, muda = false, ctl = null, rec = null, sample = null, demoTimer = null;
let audioCtx = null, micAnalisador = null, geracao = 0, falas = 0;

function setFase(f, txt){ fase = f; estadoEl.textContent = txt ?? ({parada:'', ouvindo:'ouvindo', pensando:'pensando', falando:'falando'})[f]; }
function erro(msg){ erroEl.textContent = msg || ''; erroEl.hidden = !msg; }

/* ---------- o círculo ---------- */
let nivel = 0, alvo = 0, t0 = performance.now();
const reduzido = matchMedia('(prefers-reduced-motion: reduce)').matches;
function medir(an){ if (!an) return 0; const buf = new Uint8Array(an.fftSize); an.getByteTimeDomainData(buf);
  let s = 0; for (const v of buf){ const d = (v - 128) / 128; s += d * d; } return Math.min(1, Math.sqrt(s / buf.length) * 4); }
function desenhar(now){
  const t = (now - t0) / 1000, W = orb.width, c = W / 2, base = W * 0.27;
  if (fase === 'ouvindo') alvo = medir(micAnalisador) * .8;
  else if (fase !== 'falando') alvo = 0;          // falando: o alvo vem dos eventos de fala
  nivel += (alvo - nivel) * 0.18;
  cx.clearRect(0, 0, W, W);
  const resp = reduzido ? 0 : Math.sin(t * (fase === 'pensando' ? 2.6 : 1.1)) * (fase === 'parada' ? 4 : 7);
  const r = base + resp + nivel * base * 0.45;
  const halo = cx.createRadialGradient(c, c, r * .6, c, c, r * 1.9);
  halo.addColorStop(0, `rgba(240,184,85,${0.10 + nivel * 0.25})`); halo.addColorStop(1, 'rgba(240,184,85,0)');
  cx.fillStyle = halo; cx.beginPath(); cx.arc(c, c, r * 1.9, 0, Math.PI * 2); cx.fill();
  const corpo = cx.createRadialGradient(c - r * .3, c - r * .35, r * .1, c, c, r);
  corpo.addColorStop(0, '#0f3a63'); corpo.addColorStop(1, '#031c37');
  cx.fillStyle = corpo; cx.beginPath(); cx.arc(c, c, r, 0, Math.PI * 2); cx.fill();
  cx.lineWidth = 3 + nivel * 6; cx.strokeStyle = `rgba(240,184,85,${fase === 'parada' ? .55 : .95})`;
  cx.beginPath(); cx.arc(c, c, r, 0, Math.PI * 2); cx.stroke();
  if (fase === 'ouvindo' || fase === 'falando') for (let i = 1; i <= 3; i++){
    cx.lineWidth = 1; cx.strokeStyle = `rgba(240,184,85,${(0.35 - i * 0.09) * (0.4 + nivel)})`;
    cx.beginPath(); cx.arc(c, c, r + i * (22 + nivel * 40), 0, Math.PI * 2); cx.stroke(); }
  if (fase === 'pensando'){ const a = reduzido ? 0 : t * 2.2; cx.lineWidth = 5; cx.strokeStyle = 'rgba(240,184,85,.95)';
    cx.beginPath(); cx.arc(c, c, r + 16, a, a + Math.PI * .7); cx.stroke(); }
  requestAnimationFrame(desenhar);
}
requestAnimationFrame(desenhar);

/* ---------- microfone (só para o desenho e o barge-in) ---------- */
async function ligarMic(){
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    micAnalisador = audioCtx.createAnalyser(); micAnalisador.fftSize = 512;
    audioCtx.createMediaStreamSource(mic).connect(micAnalisador);
  } catch (e) { audioCtx = audioCtx || {}; }
}

/* ---------- voz dela: síntese do navegador, frase a frase ---------- */
function vozPt(){ const vs = speechSynthesis.getVoices?.() || [];
  return vs.find(v => /pt[-_]BR/i.test(v.lang) && /Luciana|Francisca|Maria|female|feminin/i.test(v.name)) || vs.find(v => /pt[-_]BR/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null; }
function pararVoz(){ geracao++; falas = 0; try { speechSynthesis.cancel(); } catch (e) {} }
function falar(frase, g){
  if (muda || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(frase); u.lang = 'pt-BR'; u.rate = 1.02; u.pitch = 0.95;
  const v = vozPt(); if (v) u.voice = v;
  falas++;
  u.onstart = () => { if (g === geracao) setFase('falando'); };
  u.onboundary = () => { alvo = 0.35 + Math.random() * 0.5; setTimeout(() => { alvo = 0.1; }, 90); };
  u.onend = u.onerror = () => { falas = Math.max(0, falas - 1); alvo = 0; if (!falas && g === geracao && fase === 'falando') depoisDeFalar(); };
  speechSynthesis.speak(u);
}
function fatiar(buf){ const frases = []; let m, ultimo = 0; const re = /[^.!?…]+[.!?…]+["”)]?\s+/g;
  while ((m = re.exec(buf))){ frases.push(m[0].trim()); ultimo = re.lastIndex; } return { frases, resto: buf.slice(ultimo) }; }
function depoisDeFalar(){ if (ligada) ouvir(); else { setFase('parada'); dica.textContent = 'Toque no círculo e fale'; } }

/* ---------- Claude ---------- */
(async () => { sample = await window.claude?.use?.('sample') ?? null;
  if (!sample) erro('Abra dentro do claude.ai para conversar. A demonstração funciona mesmo assim.'); })();

async function perguntar(texto){
  texto = texto.trim(); if (!texto) return;
  pararDemo(); pararVoz(); ctl?.abort(); pararReconhecimento(); erro('');
  voceEl.hidden = false; voceEl.textContent = texto; elaEl.textContent = '';
  if (!sample){ erro('Sem conexão com o Claude aqui. Abra a página dentro do claude.ai.'); depoisDeFalar(); return; }
  turnos.push({ role: 'user', content: texto });
  setFase('pensando'); dica.textContent = '';
  ctl = new AbortController(); const g = geracao;
  let pendente = '', completo = '';
  try {
    const { text } = await sample([{ role: 'user', content: INSTRUCOES }, ...turnos.slice(-16)], {
      cache: false, signal: ctl.signal, modelTier: 'quick',
      onText: ({ text, delta }) => { completo = text; elaEl.textContent = text; pendente += delta;
        const { frases, resto } = fatiar(pendente); pendente = resto; for (const f of frases) falar(f, g); },
    });
    if (pendente.trim()) falar(pendente.trim(), g);
    turnos.push({ role: 'assistant', content: text });
    if (muda || !falas) depoisDeFalar();
  } catch (e) {
    if (e.code === 'cancelled') return;
    erro({ not_granted: 'Você não autorizou a página a usar o Claude. Recarregue para decidir de novo.',
           rate_limited: 'Muitas perguntas em pouco tempo. Espere um instante.',
           refused: 'Ela não pôde responder a isso. Reformule.' }[e.code] || 'A conexão falhou. Tente de novo.');
    if (e.text) turnos.push({ role: 'assistant', content: e.text });
    depoisDeFalar();
  } finally { ctl = null; }
}

/* ---------- ouvir ---------- */
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
function pararReconhecimento(){ if (rec){ const r = rec; rec = null; try { r.onend = null; r.stop(); } catch (e) {} } }
function ouvir(){
  if (!Rec){ erro('Este navegador não reconhece fala. Use o teclado.'); abrirTeclado(); setFase('parada'); return; }
  pararReconhecimento();
  const r = new Rec(); rec = r; r.lang = 'pt-BR'; r.interimResults = true; r.continuous = false;
  let final = '';
  r.onresult = ev => { let parcial = ''; for (const res of ev.results) (res.isFinal ? (final += res[0].transcript) : (parcial += res[0].transcript));
    voceEl.hidden = false; voceEl.textContent = final || parcial; };
  r.onerror = ev => { if (ev.error === 'not-allowed'){ erro('Microfone bloqueado. Use o teclado.'); abrirTeclado(); ligada = false; setFase('parada'); } };
  r.onend = () => { if (rec !== r) return; rec = null; if (final.trim()) perguntar(final); else if (ligada && fase === 'ouvindo') ouvir(); };
  setFase('ouvindo'); dica.textContent = ''; try { r.start(); } catch (e) {}
}
setInterval(() => { if (fase === 'falando' && micAnalisador && medir(micAnalisador) > 0.22){ pararVoz(); ctl?.abort(); ouvir(); } }, 120);

/* ---------- demonstração: o ciclo simulado, sem gastar nada ---------- */
function pararDemo(){ if (demoTimer){ clearInterval(demoTimer); demoTimer = null; } }
$('#demo').addEventListener('click', () => {
  pararDemo(); pararVoz(); ctl?.abort(); pararReconhecimento(); ligada = false; erro('');
  const frase = 'Victor conduz a operação: marketing, audiovisual e a agência. Roberto e Leonardo são sócios, e Roberto é o gate humano de publicação. O doutor Jarbas é sócio e juiz educador. Anna e Gabi entraram no marketing em agosto.';
  let passo = 0, i = 0;
  voceEl.hidden = false; voceEl.textContent = 'Minerva, quem é quem na EJUP?'; elaEl.textContent = ''; dica.textContent = '';
  setFase('ouvindo');
  demoTimer = setInterval(() => {
    passo++;
    if (passo < 28) alvo = 0.15 + Math.random() * 0.55;
    else if (passo === 28) { setFase('pensando'); alvo = 0; }
    else if (passo === 50) setFase('falando');
    else if (passo > 50 && i < frase.length){ i += 3; elaEl.textContent = frase.slice(0, i); alvo = 0.1 + Math.random() * 0.7; }
    else if (passo > 50){ pararDemo(); alvo = 0; setFase('parada'); dica.textContent = 'Toque no círculo e fale'; }
  }, 90);
});

/* ---------- controles ---------- */
orb.addEventListener('click', async () => {
  pararDemo(); await ligarMic();
  if (!ligada){ ligada = true; ouvir(); }
  else if (fase === 'falando'){ pararVoz(); ctl?.abort(); ouvir(); }
  else if (fase === 'ouvindo'){ ligada = false; pararReconhecimento(); setFase('parada'); dica.textContent = 'Toque para voltar a ouvir'; }
  else { ligada = true; ouvir(); }
});
$('#mudo').addEventListener('click', e => { muda = !muda; e.currentTarget.setAttribute('aria-pressed', String(!muda)); if (muda) pararVoz(); });
function abrirTeclado(){ $('#teclado').classList.add('aberto'); $('#entrada').focus(); }
$('#btnTeclado').addEventListener('click', () => { $('#teclado').classList.toggle('aberto'); $('#entrada').focus(); });
$('#teclado').addEventListener('submit', e => { e.preventDefault(); const v = $('#entrada').value; $('#entrada').value = ''; perguntar(v); });
$('#nova').addEventListener('click', () => { pararDemo(); pararVoz(); ctl?.abort(); turnos = []; voceEl.hidden = true; elaEl.textContent = ''; erro(''); });
</script>
