<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>EJUP — Capa · A legitimidade da investigação defensiva no processo penal</title>
<style>
__FONT_FACES__

:root{
  --navy:#031c37; --ink:#0d131a; --steel:#304557;
  --silver:#d1d3d4; --gold:#f0b855; --bronze:#9b6b26;
  --graphite:#414042; --gray:#5f6062;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#10151b;}
body{display:flex;justify-content:center;padding:24px 0;font-family:'Gotham','Montserrat',system-ui,sans-serif;}

.cover{
  position:relative;
  width:1600px; height:900px;
  overflow:hidden;
  background:
    radial-gradient(60% 80% at 100% 50%, rgba(240,184,85,0.07) 0%, rgba(240,184,85,0) 60%),
    linear-gradient(112deg, #06101c 0%, var(--navy) 55%, #0a2340 100%);
  color:#fff;
}

/* grão fino */
.cover::before{
  content:""; position:absolute; inset:0; z-index:5; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>");
  opacity:.03; mix-blend-mode:overlay;
}

/* ---- cantoneiras douradas: moldura editorial, dois cantos opostos ---- */
.bracket{ position:absolute; z-index:4; width:150px; height:150px; pointer-events:none; }
.bracket::before,.bracket::after{ content:""; position:absolute; background:var(--gold); opacity:.85; }
.bracket--tl{ top:40px; left:40px; }
.bracket--tl::before{ top:0; left:0; width:100%; height:1.5px; }
.bracket--tl::after { top:0; left:0; width:1.5px; height:100%; }
.bracket--br{ bottom:40px; right:40px; }
.bracket--br::before{ bottom:0; right:0; width:100%; height:1.5px; }
.bracket--br::after { bottom:0; right:0; width:1.5px; height:100%; }

/* ---- painel de foto: recorte diagonal sutil, costura dourada, fusão no fundo ---- */
.photo{
  position:absolute; top:0; right:0; bottom:0;
  width:700px; z-index:1;
  background:var(--steel);
  clip-path:polygon(120px 0, 100% 0, 100% 100%, 40px 100%);
}
.photo img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 20%; }
.photo .fade{
  position:absolute; inset:0;
  background:linear-gradient(97deg, var(--ink) 4%, rgba(13,19,26,0.85) 14%, rgba(13,19,26,0) 34%);
}
.photo .fade-bottom{
  position:absolute; inset:0;
  background:linear-gradient(0deg, rgba(3,28,55,0.6) 0%, rgba(3,28,55,0) 32%);
}
/* filete dourado acompanhando a diagonal do recorte */
/* O recorte vai de (1020,0) a (940,900): 80px de deriva em 900px = 5,08°.
   rotate positivo no CSS joga a base para a ESQUERDA, que é o que o recorte faz. */
.seam{
  position:absolute; top:-20px; height:940px; width:2px; z-index:3;
  left:1019px;
  transform:rotate(5.08deg);
  transform-origin:top center;
  background:linear-gradient(180deg, rgba(240,184,85,0) 0%, var(--gold) 12%, var(--gold) 88%, rgba(240,184,85,0) 100%);
  box-shadow:0 0 18px rgba(240,184,85,0.28);
}

.no-photo .photo{ background:linear-gradient(150deg, var(--steel) 0%, var(--navy) 100%); }
.no-photo .photo .slot{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  padding-left:120px;
}
.no-photo .photo .slot span{
  font-size:19px; letter-spacing:.14em; color:rgba(255,255,255,.28); text-transform:uppercase;
}
.has-photo .slot{ display:none; }

/* ---- corpo ---- */
.body{
  position:relative; z-index:3;
  width:940px; height:100%;
  padding:0 0 0 112px;
  display:flex; flex-direction:column; justify-content:center;
}

.eyebrow{
  font-size:19px; font-weight:500; letter-spacing:.2em; text-transform:uppercase;
  color:var(--gold); margin:0 0 26px;
}
.eyebrow .sep{ margin:0 14px; opacity:.55; }

.title{
  font-size:62px; font-weight:900; line-height:1.06; letter-spacing:-0.022em;
  color:#fff; margin:0; max-width:790px;
}
.title .g{ color:var(--gold); }

.rule{ width:120px; height:1.5px; background:var(--gold); border:0; margin:36px 0 26px; opacity:.9; }

.subtitle{
  font-size:26px; font-weight:300; line-height:1.45; letter-spacing:.005em;
  color:var(--gold); margin:0 0 56px; max-width:660px;
}

/* autores: anéis dourados ligados por uma haste fina, como na referência */
.authors{ position:relative; display:flex; flex-direction:column; gap:22px; margin:0; padding-left:0; }
.authors::before{
  content:""; position:absolute; left:17px; top:34px; bottom:34px; width:1px;
  background:rgba(240,184,85,.5);
}
.author{ display:flex; align-items:center; gap:18px; }
.author .ring{
  width:36px; height:36px; border-radius:50%; flex:none;
  border:1.5px solid rgba(240,184,85,.7);
  background:var(--navy);
  display:flex; align-items:center; justify-content:center;
  position:relative; z-index:1;
}
.author .ring svg{ width:16px; height:16px; }
.author .name{ font-size:22px; font-weight:500; color:#fff; letter-spacing:.002em; }

.footer-logo{ position:absolute; left:112px; bottom:56px; z-index:3; }
.footer-logo img{ height:34px; width:auto; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ic-user" viewBox="0 0 24 24">
    <circle cx="12" cy="8" r="4" fill="#f0b855"/>
    <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="#f0b855"/>
  </symbol>
</svg>

<section class="cover __FOTO_CLASS__">

  <div class="photo">
    __FOTO_TAG__
    <div class="slot"><span>Foto dos autores</span></div>
    <div class="fade"></div>
    <div class="fade-bottom"></div>
  </div>
  <div class="seam"></div>

  <div class="bracket bracket--tl"></div>
  <div class="bracket bracket--br"></div>

  <div class="body">
    <p class="eyebrow">EJUP<span class="sep">|</span>Artigo</p>

    <h1 class="title">A legitimidade da <span class="g">investigação defensiva</span> no processo penal</h1>

    <hr class="rule">

    <p class="subtitle">Fundamentos, limites e aplicação prática</p>

    <div class="authors">
      <div class="author">
        <span class="ring"><svg viewBox="0 0 24 24"><use href="#ic-user"/></svg></span>
        <span class="name">Thiago Praxedes de Vasconcelos</span>
      </div>
      <div class="author">
        <span class="ring"><svg viewBox="0 0 24 24"><use href="#ic-user"/></svg></span>
        <span class="name">Thiago de Moura Correia</span>
      </div>
    </div>
  </div>

  <div class="footer-logo"><img src="__LOGO_WHITE__" alt="EJUP"></div>

</section>
</body>
</html>
