<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>EJUP — Capa · A legitimidade da investigação defensiva no processo penal</title>
<style>
__FONT_FACES__

:root{
  --navy:#031c37; --ink:#0d131a; --steel:#304557;
  --silver:#d1d3d4; --gold:#f0b855; --bronze:#9b6b26;
  --graphite:#414042; --gray:#5f6062;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#10151b;}
body{display:flex;justify-content:center;padding:24px 0;font-family:'Gotham','Montserrat',system-ui,sans-serif;}

.cover{
  position:relative;
  width:1600px; height:900px;
  overflow:hidden;
  background: linear-gradient(115deg, var(--ink) 0%, var(--navy) 46%, var(--steel) 100%);
  color:#fff;
}

/* grão fino */
.cover::before{
  content:""; position:absolute; inset:0; z-index:4; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>");
  opacity:.03; mix-blend-mode:overlay;
}

/* ---- motivo de colunas: textura arquitetônica depurada, canto vazio, nunca sob o texto ---- */
.cols{
  position:absolute; left:96px; top:-34px; z-index:0;
  width:230px; height:auto; opacity:.10; color:var(--silver);
}
.cols svg{display:block;width:100%;height:auto;}

/* ---- painel de foto: à direita, sem corte diagonal — funde na base navy por gradiente ---- */
.photo{
  position:absolute; top:0; right:0; bottom:0;
  width:640px; z-index:1;
  background:var(--steel);
}
.photo img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 22%; }
.photo .fade{
  position:absolute; inset:0;
  background:linear-gradient(90deg, var(--ink) 0%, rgba(13,19,26,0.72) 9%, rgba(13,19,26,0) 24%);
}
.photo .fade-bottom{
  position:absolute; inset:0;
  background:linear-gradient(0deg, rgba(3,28,55,0.55) 0%, rgba(3,28,55,0) 34%);
}
/* costura dourada fina entre a foto e o fundo — nunca corte duro */
.seam{
  position:absolute; top:64px; bottom:64px; z-index:2;
  left:calc(1600px - 640px - 1px);
  width:2px; background:linear-gradient(180deg, rgba(240,184,85,0) 0%, var(--gold) 18%, var(--gold) 82%, rgba(240,184,85,0) 100%);
  opacity:.55;
}

.no-photo .photo{ background:linear-gradient(150deg, var(--steel) 0%, var(--navy) 100%); }
.no-photo .photo .slot{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:14px;
}
.no-photo .photo .slot span{
  font-size:20px; letter-spacing:.14em; color:rgba(255,255,255,.28); text-transform:uppercase;
}
.has-photo .slot{ display:none; }

/* ---- corpo de texto ---- */
.body{
  position:relative; z-index:3;
  width:900px; height:100%;
  padding:88px 0 72px 96px;
  display:flex; flex-direction:column; justify-content:center;
}

.eyebrow{
  display:flex; align-items:center; gap:16px;
  font-size:20px; font-weight:500; letter-spacing:.16em; text-transform:uppercase;
  color:var(--gold); margin:0 0 30px;
}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}

.title{
  font-size:58px; font-weight:900; line-height:1.08; letter-spacing:-0.02em;
  color:#fff; margin:0; max-width:760px;
}

.rule{ width:96px; height:2px; background:var(--gold); border:0; margin:38px 0 30px; }

.subtitle{
  font-size:25px; font-weight:300; line-height:1.5;
  color:rgba(209,211,212,.82); margin:0 0 52px; max-width:640px;
}

.authors{ display:flex; flex-direction:column; gap:16px; margin:0; }
.author{ display:flex; align-items:center; gap:16px; }
.author .ring{
  width:34px; height:34px; border-radius:50%;
  border:1.5px solid rgba(240,184,85,.55);
  display:flex; align-items:center; justify-content:center; flex:none;
}
.author .ring svg{width:16px;height:16px;}
.author .name{ font-size:21px; font-weight:500; color:#fff; }
.author .role{ font-size:16px; font-weight:300; color:rgba(209,211,212,.6); margin-left:2px; }

.footer-logo{
  position:absolute; left:96px; bottom:56px; z-index:3;
}
.footer-logo img{ height:34px; width:auto; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="col" viewBox="0 0 76 150">
    <g fill="currentColor">
      <rect x="3" y="7"   width="70" height="12"/>
      <path d="M10 19 H66 L60 28 H16 Z"/>
      <path d="M16 28 H60 L63 130 H13 Z"/>
      <rect x="5" y="130" width="66" height="12"/>
      <rect x="1" y="142" width="74" height="6"/>
    </g>
    <g stroke="rgba(0,0,0,0.22)" stroke-width="1.3" fill="none">
      <path d="M27 34 L25.6 124"/>
      <path d="M38 34 L38   124"/>
      <path d="M49 34 L50.4 124"/>
    </g>
  </symbol>
  <symbol id="ic-user" viewBox="0 0 24 24">
    <circle cx="12" cy="8" r="4" fill="var(--gold)"/>
    <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8" fill="var(--gold)"/>
  </symbol>
</svg>

<section class="cover __FOTO_CLASS__">

  <div class="cols">
    <svg viewBox="0 0 340 260">
      <g opacity="1" color="currentColor">
        <use href="#col" x="0"   y="30" width="76" height="150"/>
        <use href="#col" x="88"  y="30" width="76" height="150"/>
        <use href="#col" x="176" y="30" width="76" height="150"/>
        <use href="#col" x="264" y="30" width="76" height="150"/>
      </g>
      <rect x="-6" y="182" width="352" height="4" fill="currentColor"/>
    </svg>
  </div>

  <div class="photo">
    __FOTO_TAG__
    <div class="slot"><span>Foto dos autores</span></div>
    <div class="fade"></div>
    <div class="fade-bottom"></div>
  </div>
  <div class="seam"></div>

  <div class="body">
    <p class="eyebrow"><span class="dot"></span>EJUP&nbsp;&nbsp;|&nbsp;&nbsp;Coluna jurídica</p>

    <h1 class="title">A legitimidade da investigação defensiva no processo penal</h1>

    <hr class="rule">

    <p class="subtitle">Fundamentos, limites e aplicação prática.</p>

    <div class="authors">
      <div class="author">
        <span class="ring"><svg viewBox="0 0 24 24"><use href="#ic-user"/></svg></span>
        <span class="name">Thiago Praxedes de Vasconcelos</span>
      </div>
      <div class="author">
        <span class="ring"><svg viewBox="0 0 24 24"><use href="#ic-user"/></svg></span>
        <span class="name">Thiago de Moura Correia</span>
      </div>
    </div>
  </div>

  <div class="footer-logo"><img src="__LOGO_WHITE__" alt="EJUP"></div>

</section>
</body>
</html>
