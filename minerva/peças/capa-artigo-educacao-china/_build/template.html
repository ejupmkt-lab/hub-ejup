<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>EJUP — Capa · O poder de polícia ambiental municipal</title>
<style>
__FONT_FACES__
:root{
  --navy:#031c37; --deep:#061424; --steel:#304557;
  --silver:#d1d3d4; --gold:#f0b855; --bronze:#9b6b26;
}
*{box-sizing:border-box}
html,body{margin:0;background:#10151b}
body{display:flex;flex-wrap:wrap;gap:28px;padding:28px;align-items:flex-start;
     font-family:'Gotham','Montserrat',system-ui,sans-serif}

/* ============ base comum aos três formatos ============ */
.cover{
  position:relative; overflow:hidden; color:#fff;
  background:
    radial-gradient(38% 55% at 76% 46%, rgba(240,184,85,.10) 0%, rgba(240,184,85,0) 70%),
    radial-gradient(70% 80% at 8% 0%, #0a2340 0%, rgba(10,35,64,0) 60%),
    linear-gradient(160deg, #071a2f 0%, var(--deep) 55%, #040d18 100%);
}
.bokeh{position:absolute;inset:0;z-index:0;pointer-events:none}
.bokeh span{position:absolute;border-radius:50%;filter:blur(2px);
  background:radial-gradient(circle, rgba(48,69,87,.55) 0%, rgba(48,69,87,0) 70%)}
.cover::before{ /* grão */
  content:"";position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.03;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>")}

.halo{position:absolute;z-index:1;border-radius:50%;pointer-events:none;filter:blur(6px);opacity:.62;
  background:radial-gradient(circle at 50% 45%, rgba(240,184,85,.8) 0%, rgba(240,184,85,.5) 30%,
             rgba(155,107,38,.22) 52%, rgba(240,184,85,0) 70%)}
.foto{position:absolute;z-index:2}
.foto img{position:absolute;width:auto;display:block;
  filter:drop-shadow(0 24px 60px rgba(0,0,0,.55))}
/* sem o arquivo, o lugar do retrato fica marcado em vez de sumir */
.slot{position:absolute;inset:12% 10%;border:1.5px dashed rgba(240,184,85,.35);
  border-radius:24px;display:flex;align-items:center;justify-content:center;text-align:center}
.slot span{font-size:18px;letter-spacing:.14em;text-transform:uppercase;line-height:1.9;
  color:rgba(255,255,255,.38)}
.has-foto .slot{display:none}
/* piso: o retrato se dissolve no fundo em vez de terminar em corte */
.piso{position:absolute;z-index:3;pointer-events:none;
  background:linear-gradient(0deg, #040d18 8%, rgba(4,13,24,.85) 45%, rgba(4,13,24,0) 100%)}

.texto{position:relative;z-index:4;display:flex;flex-direction:column}
.tag{display:inline-flex;align-self:flex-start;align-items:center;border-radius:999px;
  border:1.5px solid rgba(240,184,85,.7);background:rgba(240,184,85,.06);
  font-weight:500;text-transform:uppercase;color:var(--gold)}
.titulo{font-weight:900;line-height:1.08;letter-spacing:-.022em;margin:0;color:#fff}
.titulo .g{color:var(--gold);font-weight:300;letter-spacing:-.01em}
.sub{font-weight:300;line-height:1.5;color:rgba(209,211,212,.78);margin:0}
.meta{display:flex;align-items:center;color:rgba(209,211,212,.85)}
.meta .item{display:flex;align-items:center;gap:12px}
.meta .item svg{flex:none;width:1.05em;height:1.05em}
.meta .sep{width:1px;background:rgba(209,211,212,.28)}
.autor{display:flex;align-items:baseline;flex-wrap:wrap;color:#fff;font-weight:500}
.autor .cargo{font-weight:300;color:rgba(209,211,212,.8)}
.autor .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);
  align-self:center;margin:0 14px}
.logo{position:absolute;z-index:4}
.logo img{width:auto;display:block}

/* ============ HORIZONTAL 1600×900 ============
   O site corta a capa e mostra só a FAIXA DE CIMA. Por isso todo o conteúdo
   que precisa ser lido vive acima de --corte; o que fica abaixo é sobra. */
.fmt-h{width:1600px;height:900px;border-radius:28px;--corte:512px}
.fmt-h .bokeh .b1{width:240px;height:240px;left:540px;top:-70px;opacity:.5}
.fmt-h .bokeh .b2{width:170px;height:170px;left:1150px;top:30px;opacity:.42}
.fmt-h .bokeh .b3{width:300px;height:300px;left:1380px;top:520px;opacity:.45}
.fmt-h .halo{left:960px;top:-20px;width:460px;height:460px}
.fmt-h .foto{right:0;top:0;bottom:0;width:720px}
.fmt-h .foto img{right:-40px;top:40px;height:860px}
.fmt-h .piso{left:880px;right:0;bottom:0;height:230px}
.fmt-h .texto{position:absolute;left:96px;top:64px;width:900px}
.fmt-h .tag{padding:11px 24px;font-size:15px;letter-spacing:.18em;margin-bottom:32px}
.fmt-h .titulo{font-size:62px;max-width:780px}
.fmt-h .sub{font-size:25px;margin-top:26px;max-width:700px}
.fmt-h .meta{font-size:19px;margin-top:34px}
.fmt-h .meta .sep{height:26px;margin:0 28px}
.fmt-h .autor{font-size:19px;margin-top:18px}
.fmt-h .logo{left:96px;bottom:56px}
.fmt-h .logo img{height:32px}

/* ============ STORY 1080×1920 ============ */
.fmt-v{width:1080px;height:1920px}
.fmt-v .bokeh .b1{width:220px;height:220px;left:60px;top:820px;opacity:.45}
.fmt-v .bokeh .b2{width:150px;height:150px;left:880px;top:640px;opacity:.4}
.fmt-v .halo{left:150px;top:820px;width:800px;height:800px}
.fmt-v .foto{left:0;right:0;bottom:0;top:600px}
.fmt-v .foto img{left:50%;transform:translateX(-50%);bottom:-40px;height:1120px}
.fmt-v .piso{left:0;right:0;bottom:0;height:300px}
.fmt-v .texto{position:absolute;left:88px;right:88px;top:120px}
.fmt-v .tag{padding:13px 28px;font-size:17px;letter-spacing:.18em;margin-bottom:40px}
.fmt-v .titulo{font-size:76px}
.fmt-v .sub{font-size:31px;margin-top:30px}
.fmt-v .meta{font-size:23px;margin-top:40px}
.fmt-v .meta .sep{height:30px;margin:0 28px}
.fmt-v .autor{font-size:24px;margin-top:22px}
.fmt-v .logo{left:50%;transform:translateX(-50%);bottom:88px}
.fmt-v .logo img{height:48px}

/* ============ FEED 1080×1440 ============ */
.fmt-f{width:1080px;height:1440px}
.fmt-f .bokeh .b1{width:200px;height:200px;left:70px;top:700px;opacity:.45}
.fmt-f .bokeh .b2{width:150px;height:150px;left:880px;top:520px;opacity:.4}
.fmt-f .halo{left:170px;top:640px;width:740px;height:740px}
.fmt-f .foto{left:0;right:0;bottom:0;top:560px}
.fmt-f .foto img{left:50%;transform:translateX(-50%);bottom:-120px;height:1000px}
.fmt-f .piso{left:0;right:0;bottom:0;height:250px}
.fmt-f .texto{position:absolute;left:80px;right:80px;top:96px}
.fmt-f .tag{padding:12px 26px;font-size:16px;letter-spacing:.18em;margin-bottom:34px}
.fmt-f .titulo{font-size:68px}
.fmt-f .sub{font-size:28px;margin-top:26px}
.fmt-f .meta{font-size:21px;margin-top:34px}
.fmt-f .meta .sep{height:28px;margin:0 26px}
.fmt-f .autor{font-size:22px;margin-top:20px}
.fmt-f .logo{left:50%;transform:translateX(-50%);bottom:64px}
.fmt-f .logo img{height:44px}

/* LinkedIn horizontal 1200x627: texto à esquerda, retrato à direita */
.fmt-l{width:1200px;height:627px}
.fmt-l .bokeh .b1{width:180px;height:180px;left:420px;top:-50px;opacity:.45}
.fmt-l .bokeh .b2{width:130px;height:130px;left:860px;top:20px;opacity:.4}
.fmt-l .bokeh .b3{width:220px;height:220px;left:1040px;top:400px;opacity:.4}
.fmt-l .halo{left:780px;top:-10px;width:330px;height:330px}
.fmt-l .foto{right:0;top:0;bottom:0;width:680px}
.fmt-l .foto img{right:-30px;top:30px;height:620px}
.fmt-l .piso{left:0;right:0;bottom:0;height:150px}
.fmt-l .texto{position:absolute;left:64px;top:52px;width:640px}
.fmt-l .tag{padding:8px 18px;font-size:12px;letter-spacing:.18em;margin-bottom:22px}
.fmt-l .titulo{font-size:46px;max-width:620px}
.fmt-l .sub{font-size:19px;margin-top:18px;max-width:520px}
.fmt-l .meta{font-size:15px;margin-top:24px}
.fmt-l .meta .sep{height:20px;margin:0 20px}
.fmt-l .autor{font-size:15px;margin-top:14px}
.fmt-l .logo{left:64px;bottom:44px}
.fmt-l .logo img{height:26px}

/* LinkedIn vertical 1080x1350 (4:5): o feed 3:4 com menos altura */
.fmt-p{width:1080px;height:1350px}
.fmt-p .bokeh .b1{width:200px;height:200px;left:70px;top:660px;opacity:.45}
.fmt-p .bokeh .b2{width:150px;height:150px;left:880px;top:500px;opacity:.4}
.fmt-p .halo{left:190px;top:600px;width:700px;height:700px}
.fmt-p .foto{left:0;right:0;bottom:0;top:540px}
.fmt-p .foto img{left:50%;transform:translateX(-50%);bottom:-110px;height:930px}
.fmt-p .piso{left:0;right:0;bottom:0;height:230px}
.fmt-p .texto{position:absolute;left:80px;right:80px;top:84px}
.fmt-p .tag{padding:12px 26px;font-size:16px;letter-spacing:.18em;margin-bottom:30px}
.fmt-p .titulo{font-size:66px}
.fmt-p .sub{font-size:27px;margin-top:22px}
.fmt-p .meta{font-size:21px;margin-top:30px}
.fmt-p .meta .sep{height:28px;margin:0 26px}
.fmt-p .autor{font-size:21px;margin-top:18px}
.fmt-p .logo{left:50%;transform:translateX(-50%);bottom:56px}
.fmt-p .logo img{height:42px}

/* ---- só o fundo ----
   Nada de texto, retrato ou assinatura, e sem o brilho dourado: fica só o
   degradê navy com o bokeh de aço e o grão. É a base para receber arte por
   cima. */
.bg .foto,.bg .halo,.bg .piso,.bg .logo,.bg .texto{display:none}
.bg{background:
    radial-gradient(70% 80% at 8% 0%, #0a2340 0%, rgba(10,35,64,0) 60%),
    linear-gradient(160deg, #071a2f 0%, var(--deep) 55%, #040d18 100%)}

/* ---- versão limpa: sem retrato e sem logo ----
   Só some o que é imagem e assinatura. O texto NÃO se move: fica exatamente
   na mesma posição da versão com foto, para as duas serem intercambiáveis. */
.limpa .foto,.limpa .halo,.limpa .piso,.limpa .logo{display:none}

/* guia da faixa visível do site, só na prova (--guia) */
.guia .fmt-h::after{content:"faixa visível no site";position:absolute;left:0;right:0;
  top:var(--corte);border-top:2px dashed rgba(255,90,90,.9);color:#ff5a5a;
  font-size:15px;letter-spacing:.16em;text-transform:uppercase;padding:8px 12px;z-index:9}
</style></head>
<body>
__COVERS__
<script>
/* o halo dourado fica centrado na cabeça do retrato, em qualquer formato:
   mede onde a foto caiu e põe o centro do halo no ponto (FX, FY) da imagem */
(function () {
  const FX = 0.497, FY = 0.30;   // centro da cabeça, em fração da foto tratada
  const DH = 0.62;               // diâmetro do halo, em fração da altura do retrato
  document.querySelectorAll('.cover').forEach(s => {
    const img = s.querySelector('.foto img'), h = s.querySelector('.halo');
    if (!img || !h || !img.offsetParent) return;
    const centrar = () => {
      const sr = s.getBoundingClientRect(), r = img.getBoundingClientRect();
      // o tamanho também segue o retrato: mesmo diâmetro em relação à cabeça
      // em todos os formatos (antes cada formato tinha um valor fixo)
      const d = r.height * DH;
      h.style.width = h.style.height = d + 'px';
      h.style.left = (r.left - sr.left + r.width * FX - d / 2) + 'px';
      h.style.top = (r.top - sr.top + r.height * FY - d / 2) + 'px';
    };
    img.complete ? centrar() : img.addEventListener('load', centrar);
  });
})();
</script>
</body></html>
