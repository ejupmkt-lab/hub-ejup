<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Carrossel — Poder de polícia ambiental municipal</title>
<style>
__FONT_FACES__
:root{
  --navy:#031c37; --deep:#061424; --ink:#0d131a; --steel:#304557;
  --graphite:#414042; --gray:#5f6062; --silver:#d1d3d4;
  --gold:#f0b855; --bronze:#9b6b26;
}
*{box-sizing:border-box}
html,body{margin:0;background:#5b6169}
body{display:flex;flex-wrap:wrap;gap:28px;padding:28px;
     font-family:'Gotham','Montserrat',system-ui,sans-serif}

.slide{position:relative;width:1080px;height:1440px;overflow:hidden;
       padding:88px 80px 0;display:flex;flex-direction:column}

/* ---------- dois fundos, alternados para dar ritmo ---------- */
.escuro{color:#fff;
  background:
    radial-gradient(70% 70% at 8% 0%, #0a2340 0%, rgba(10,35,64,0) 62%),
    linear-gradient(160deg, #071a2f 0%, var(--deep) 55%, #040d18 100%)}
.escuro::before{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;
  opacity:.03;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>")}
.claro{color:var(--navy);background:#fff}

/* grafismo da marca, só no escuro */
.marca-fundo{position:absolute;top:-160px;right:-190px;width:620px;opacity:.14;
  pointer-events:none}
.marca-fundo svg{width:100%;height:auto;display:block}
.marca-fundo path{fill:#8fb4d8 !important}

/* ---------- o fio: entra onde o slide anterior saiu ----------
   Desenhado de borda a borda, atrás do conteúdo. Passando o dedo, a linha
   parece uma só atravessando o carrossel inteiro. */
.fio{position:absolute;inset:0;z-index:1;pointer-events:none}
.fio svg{width:100%;height:100%;display:block}

/* trilha de progresso, sem número de slide */
.trilha{display:flex;gap:8px;position:relative;z-index:4;margin-bottom:56px}
.trilha i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.16)}
.trilha i.aqui{background:var(--gold)}
.claro .trilha i{background:#e7e5e0}
.claro .trilha i.aqui{background:var(--bronze)}

.corpo{position:relative;z-index:4;display:flex;flex-direction:column;
       font-size:100px;margin-top:auto;margin-bottom:auto}

.rotulo{font-weight:500;font-size:.23em;letter-spacing:.2em;text-transform:uppercase;
        color:var(--gold);margin:0 0 .4em}
.claro .rotulo{color:var(--bronze)}
.titulo{font-weight:900;font-size:.7em;line-height:1.1;letter-spacing:-.022em;margin:0}
.titulo b{color:var(--gold);font-weight:900}
.claro .titulo b{color:var(--bronze)}
.texto{margin-top:.42em}
.texto p{font-weight:300;font-size:.36em;line-height:1.52;color:var(--silver);
         margin:0 0 .26em}
.texto p:last-child{margin-bottom:0}
.texto b{font-weight:500;color:#fff}
.claro .texto p{color:var(--graphite)}
.claro .texto b{color:var(--navy)}

.fecho{margin-top:.5em;padding-left:.28em;border-left:3px solid var(--gold)}
.fecho p{font-weight:500;font-size:.38em;line-height:1.36;color:#fff;margin:0}
.claro .fecho{border-color:var(--bronze)}
.claro .fecho p{color:var(--navy)}

/* ---------- respiro: uma frase só, no branco ---------- */
.respiro{font-size:100px;display:flex;flex-direction:column;
         margin-top:auto;margin-bottom:auto;position:relative;z-index:4}
.respiro .regua{width:1.1em;height:4px;background:var(--bronze);margin-bottom:.42em}
.respiro p{font-weight:900;font-size:.78em;line-height:1.12;letter-spacing:-.022em;
           color:var(--navy);margin:0;max-width:11.5em}
.respiro p b{color:var(--bronze);font-weight:900}
.respiro .nota{margin-top:.44em;font-weight:300;font-size:.3em;line-height:1.5;
               letter-spacing:0;color:var(--gray);max-width:16em}

/* ---------- diagramas ---------- */
.fig{margin-top:.44em}
.fig svg{width:100%;height:auto;display:block}
.fig .cap{margin-top:.2em;font-weight:500;font-size:.2em;letter-spacing:.16em;
          text-transform:uppercase;color:var(--gray)}

/* ---------- dado ---------- */
.dado{display:flex;align-items:baseline;gap:.14em}
.dado .n{font-weight:900;font-size:1.9em;line-height:.9;letter-spacing:-.04em;
         color:var(--gold)}
.dado .de{font-weight:300;font-size:.46em;color:var(--silver)}
.legenda{font-weight:300;font-size:.34em;line-height:1.45;color:var(--silver);
         margin:.2em 0 0;max-width:21em}

/* ---------- chamada, cta, assinatura ---------- */
.chamada{margin-top:.56em;display:inline-flex;align-self:flex-start;align-items:center;
  gap:.22em;padding:.3em .42em;border-radius:999px;
  border:1px solid rgba(240,184,85,.55)}
.chamada i{font-style:normal;color:var(--gold);font-size:.36em;line-height:1}
.chamada span{font-weight:500;font-size:.3em;line-height:1.3}
.cta{margin-top:.5em}
.cta p{font-weight:300;font-size:.34em;line-height:1.5;color:var(--silver);margin:0}
.cta .link{font-weight:500;font-size:.3em;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);margin-top:.32em;display:block}
.autoria{margin-top:.46em;display:flex;align-items:center;gap:.2em}
.autoria .rosto{width:1.1em;height:1.1em;border-radius:50%;overflow:hidden;
  flex:none;border:1.5px solid rgba(240,184,85,.5)}
.autoria .rosto img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;
  display:block}
.autoria .quem{font-weight:500;font-size:.28em;color:#fff;line-height:1.35}
.autoria .quem span{display:block;font-weight:300;color:var(--silver)}
.assina{margin-top:.5em;padding-top:.3em;border-top:1px solid rgba(255,255,255,.18)}
.assina .m{font-weight:500;font-size:.21em;letter-spacing:.24em;color:var(--gold)}
.assina .s{margin-top:.1em;font-weight:300;font-size:.36em;line-height:1.24;
           letter-spacing:-.012em;color:#fff}

/* ---------- foto ----------
   Dois usos, como no carrossel aprovado: sangrada no fundo, e em caixa dentro
   da coluna de texto. Sempre em duotone navy, para conviver com a paleta de
   oito cores sem inventar cor nova. */
.foto-bg{position:absolute;inset:0;z-index:0}
.foto-bg img{width:100%;height:100%;object-fit:cover;display:block}
/* o scrim segura a leitura do texto por cima; mais forte de um lado, para o
   olho ainda ver que existe uma foto ali */
.foto-bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(175deg, rgba(3,18,32,.62) 0%, rgba(3,18,32,.86) 46%,
             rgba(4,13,24,.96) 78%, #040d18 100%)}
.caixa-foto{margin-top:.44em;border-radius:6px;overflow:hidden;position:relative}
.caixa-foto img{width:100%;height:auto;display:block}
/* filete dourado no alto da caixa: amarra a foto ao sistema da peça */
.caixa-foto::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:var(--gold);z-index:2}

/* espaço reservado para foto, quando a foto ainda não chegou */
.slot{margin-top:.44em;border:1.5px dashed rgba(240,184,85,.4);border-radius:8px;
      height:3.4em;display:flex;align-items:center;justify-content:center;
      text-align:center}
.slot span{font-weight:500;font-size:.19em;letter-spacing:.16em;text-transform:uppercase;
           color:rgba(255,255,255,.4);line-height:2}
.slot img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.slot.cheio{border:0}

.logo{position:relative;z-index:4;margin-top:auto;margin-bottom:76px;
      align-self:center;width:250px}
.logo svg{width:100%;height:auto;display:block}
.escuro .logo path{fill:#fff !important}
.claro .logo path{fill:var(--navy) !important}
</style></head>
<body>
__SLIDES__
<script>
/* O conteúdo encolhe até caber ACIMA DO FIO, não do logo: é o fio que define
   o limite inferior útil da tela, e ele precisa passar limpo. */
document.querySelectorAll('.slide').forEach(s => {
  const c = s.querySelector('.corpo') || s.querySelector('.respiro');
  const l = s.querySelector('.logo');
  const teto = s.getBoundingClientRect().top + (+s.dataset.fio) - 28;
  const cabe = () => c.getBoundingClientRect().bottom < teto;
  let k = 100;
  while (k > 54 && !cabe()) { k -= 2; c.style.fontSize = k + 'px'; }
  s.dataset.escala = k;
});
</script>
</body></html>
