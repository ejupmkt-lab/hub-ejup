<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Carrossel — quem pode julgar um ministro do STF</title>
<style>
__FONT_FACES__
:root{
  --navy:#031c37; --deep:#061424; --ink:#0d131a; --steel:#304557;
  --graphite:#414042; --gray:#5f6062; --silver:#d1d3d4;
  --gold:#f0b855; --bronze:#9b6b26; --papel:#f3f1ec;
}
*{box-sizing:border-box}
html,body{margin:0;background:#5b6169}
body{display:flex;flex-wrap:wrap;gap:28px;padding:28px;
     font-family:'Gotham','Montserrat',system-ui,sans-serif}

.slide{position:relative;width:1080px;height:1440px;overflow:hidden;color:#fff;
  background:linear-gradient(168deg,#0a2a49 0%,#061a30 46%,#04101c 100%)}
.slide::before{content:"";position:absolute;inset:0;z-index:0;opacity:.035;
  mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>")}

/* fotografia, sempre ancorada embaixo */
.foto{position:absolute;left:0;bottom:0;width:1080px;z-index:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 26%,#000 100%);
  mask-image:linear-gradient(180deg,transparent 0%,#000 26%,#000 100%)}
.foto img{display:block;width:100%;height:auto}
.foto::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(4,16,28,.34) 0%,rgba(4,16,28,.20) 52%,
             rgba(4,16,28,.93) 100%)}

/* ===================== O SELO DE COMPETÊNCIA =====================
   Um único objeto no alto à esquerda, preso a uma haste vertical.
   Ele responde, tela a tela, a pergunta da capa: quem julga. Enquanto a
   resposta ainda não chegou, a haste fica em prata e o selo mostra a
   própria pergunta. Quando a competência aparece, a haste acende em
   dourado e o selo carrega a base legal. */
.selo{position:absolute;left:80px;top:100px;z-index:6;padding-left:24px;
  border-left:4px solid rgba(209,211,212,.34);max-width:840px}
.selo .e{font-weight:500;font-size:16px;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(209,211,212,.5)}
.selo .q{margin-top:9px;font-weight:900;font-size:30px;line-height:1.1;
  letter-spacing:-.015em;color:#fff}
.selo .b{margin-top:7px;font-weight:300;font-size:19px;letter-spacing:.02em;
  color:rgba(209,211,212,.72)}
.selo.on{border-left-color:var(--gold)}
.selo.on .e{color:var(--gold)}
.selo.on .b{color:rgba(240,184,85,.86)}
.selo.fora{border-left-color:rgba(209,211,212,.34)}
.selo.fora .q{color:rgba(255,255,255,.55)}
.selo.fora .b{color:rgba(209,211,212,.58)}

/* ===================== blocos gráficos ===================== */
/* consequências da condenação (tela 4) */
.efeitos{display:flex;gap:.26em;margin:.34em 0 0}
.efeitos div{flex:1;padding:.26em .28em .3em;
  border:1px solid rgba(240,184,85,.45)}
.efeitos b{display:block;font-weight:900;font-size:.34em;line-height:1.08;
  letter-spacing:-.018em;color:var(--gold)}
.efeitos small{display:block;margin-top:.12em;font-weight:300;font-size:.2em;
  line-height:1.42;color:rgba(209,211,212,.88)}

/* alcance do código de ética (tela 6) */
.alcance{margin:.34em 0 0;border-top:1px solid rgba(255,255,255,.2)}
.alcance div{display:flex;gap:.28em;align-items:baseline;padding:.26em 0;
  border-bottom:1px solid rgba(255,255,255,.2)}
.alcance i{font-style:normal;font-weight:400;font-size:.3em;line-height:1;
  min-width:1em;color:var(--gold)}
.alcance .nao i{color:rgba(209,211,212,.45)}
.alcance b{font-weight:700;font-size:.26em;line-height:1.26;flex:1}
.alcance .nao b{color:rgba(209,211,212,.6)}
.alcance span{font-weight:500;font-size:.17em;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gold)}
.alcance .nao span{color:rgba(209,211,212,.45)}

/* o choque de princípios (tela 9) */
.choque{display:flex;gap:.34em;margin:.34em 0 0;
  border-top:1px solid rgba(65,64,66,.3)}
.choque div{flex:1;padding-top:.26em}
.choque div+div{padding-left:.34em;border-left:1px solid rgba(65,64,66,.3)}
.choque b{display:block;font-weight:500;font-size:.18em;letter-spacing:.16em;
  text-transform:uppercase;color:var(--bronze)}
.choque p{margin:.14em 0 0;font-weight:300;font-size:.23em;line-height:1.5}

/* recapitulação (tela 11) */
.recap{margin:.3em 0 0;border-top:1px solid rgba(255,255,255,.2)}
.recap div{display:flex;gap:.24em;align-items:baseline;padding:.22em 0;
  border-bottom:1px solid rgba(255,255,255,.2)}
.recap b{flex:1;font-weight:300;font-size:.23em;line-height:1.34;
  color:rgba(209,211,212,.9)}
.recap i{font-style:normal;font-weight:400;font-size:.23em;color:var(--gold)}
.recap strong{flex:1;font-weight:700;font-size:.23em;line-height:1.34}

/* ===================== texto ===================== */
.bloco{position:absolute;left:80px;right:80px;z-index:5;font-size:100px}
.topo{top:300px}
.meio{top:360px}
.titulo{margin:0;font-size:.58em;line-height:1.12;letter-spacing:-.022em}
.titulo .k{font-weight:900;color:#fff}
.titulo .l{font-weight:300;color:rgba(255,255,255,.82)}
.titulo .g{font-weight:900;color:var(--gold)}
.corpo{margin:.3em 0 0;font-weight:300;font-size:.28em;line-height:1.58;
  text-align:justify;color:rgba(209,211,212,.9)}
.corpo b{font-weight:500;color:#fff}
.fonte{margin:.24em 0 0;font-weight:500;font-size:.17em;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold)}
.fecho{margin:.32em 0 0;font-weight:500;font-size:.29em;line-height:1.36}
.pilula{margin:.38em 0 0;display:inline-flex;align-items:center;gap:.2em;
  padding:.26em .36em;border-radius:999px;border:1px solid rgba(240,184,85,.55)}
.pilula i{font-style:normal;color:var(--gold);font-size:.3em;line-height:1}
.pilula span{font-weight:500;font-size:.25em}
.cta{margin:.3em 0 0;font-weight:500;font-size:.24em;color:var(--gold)}
.assina{margin:.34em 0 0;padding-top:.24em;
  border-top:1px solid rgba(255,255,255,.2)}
.assina .m{font-weight:500;font-size:.19em;letter-spacing:.24em;color:var(--gold)}
.assina .s{margin-top:.08em;font-weight:300;font-size:.3em;line-height:1.26;
  letter-spacing:-.012em}

.logo{position:absolute;left:0;right:0;bottom:64px;z-index:5;display:flex;
  justify-content:center}
.logo div{width:244px}
.logo svg{width:100%;height:auto;display:block}
.logo path{fill:#fff !important}

/* ===================== tela clara ===================== */
.slide.claro{background:var(--papel);color:var(--navy)}
.slide.claro::before{opacity:.05}
.claro .titulo .k{color:var(--navy)}
.claro .titulo .l{color:var(--graphite)}
.claro .titulo .g{color:var(--bronze)}
.claro .corpo{color:var(--graphite)}
.claro .fonte{color:var(--bronze)}
.claro .fecho{color:var(--navy)}
.claro .selo{border-left-color:rgba(65,64,66,.3)}
.claro .selo .e{color:var(--gray)}
.claro .selo .q{color:var(--navy)}
.claro .selo .b{color:var(--graphite)}
.claro .selo.on{border-left-color:var(--bronze)}
.claro .selo.on .e,.claro .selo.on .b{color:var(--bronze)}
.claro .selo.fora .q{color:rgba(65,64,66,.62)}
.claro .selo.fora .b{color:var(--gray)}
.claro .logo path{fill:var(--navy) !important}
</style></head>
<body>
__SLIDES__
<script>
for (const b of document.querySelectorAll('.bloco')) {
  const max = +b.dataset.max || 9999;
  let f = +b.dataset.base || 100;
  b.style.fontSize = f + 'px';
  while (b.getBoundingClientRect().height > max && f > 46) {
    f -= 1; b.style.fontSize = f + 'px';
  }
  b.closest('.slide').dataset.escala = f;
}
</script>
</body></html>
