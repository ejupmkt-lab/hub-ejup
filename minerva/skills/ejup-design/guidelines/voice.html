<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--ejup-navy);color:#fff;padding:24px 28px;box-sizing:border-box;height:200px}
  .eb{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ejup-gold);margin-bottom:10px}
  .q{font-size:22px;font-weight:300;line-height:1.35;max-width:600px}
  .cols{display:flex;gap:40px;margin-top:18px;font-size:12px;line-height:1.6}
  .cols b{color:var(--ejup-gold);font-weight:700}
  .do{color:#fff}.dont{color:var(--ejup-gray-300)}
</style></head>
<body>
  <div class="eb">Tom de voz</div>
  <div class="q">Fala com calma, densidade e precisão. Autoridade que não precisa de ruído.</div>
  <div class="cols">
    <div class="do"><b>SIM</b><br>profundidade · rigor · serenidade · tradição reinterpretada</div>
    <div class="dont"><b>NÃO</b><br>hype · promessas fáceis · atalhos · urgência · exclamação</div>
  </div>
</body></html>
