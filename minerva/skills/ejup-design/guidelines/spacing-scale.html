<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:20px 24px;box-sizing:border-box}
  .row{display:flex;align-items:flex-end;gap:14px;height:90px}
  .b{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;color:var(--text-muted)}
  .bar{background:var(--ejup-steel);width:22px;border-radius:2px}
</style></head>
<body>
  <div class="row">
    <div class="b"><div class="bar" style="height:4px"></div>1</div>
    <div class="b"><div class="bar" style="height:8px"></div>2</div>
    <div class="b"><div class="bar" style="height:12px"></div>3</div>
    <div class="b"><div class="bar" style="height:16px"></div>4</div>
    <div class="b"><div class="bar" style="height:24px"></div>5</div>
    <div class="b"><div class="bar" style="height:32px"></div>6</div>
    <div class="b"><div class="bar" style="height:48px"></div>8</div>
    <div class="b"><div class="bar" style="height:64px"></div>10</div>
    <div class="b"><div class="bar" style="height:90px"></div>12</div>
  </div>
</body></html>
