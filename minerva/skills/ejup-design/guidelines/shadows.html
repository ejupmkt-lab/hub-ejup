<!-- @dsCard group="Spacing" viewport="700x160" name="Shadows" subtitle="Soft, navy-tinted elevation + gold glow" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface-muted);padding:26px 24px;box-sizing:border-box}
  .row{display:flex;gap:24px;align-items:center}
  .b{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:10px;color:var(--text-muted)}
  .c{width:96px;height:64px;background:#fff;border-radius:var(--radius-md)}
</style></head>
<body>
  <div class="row">
    <div class="b"><div class="c" style="box-shadow:var(--shadow-sm)"></div>shadow-sm</div>
    <div class="b"><div class="c" style="box-shadow:var(--shadow-md)"></div>shadow-md</div>
    <div class="b"><div class="c" style="box-shadow:var(--shadow-lg)"></div>shadow-lg</div>
    <div class="b"><div class="c" style="box-shadow:var(--shadow-gold);background:var(--ejup-gold)"></div>shadow-gold</div>
  </div>
</body></html>
