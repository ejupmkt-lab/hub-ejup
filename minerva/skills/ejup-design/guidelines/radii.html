<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:20px;box-sizing:border-box}
  .row{display:flex;gap:18px;align-items:center}
  .b{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:10px;color:var(--text-muted)}
  .sq{width:64px;height:64px;background:var(--surface-muted);border:1px solid var(--border-strong)}
</style></head>
<body>
  <div class="row">
    <div class="b"><div class="sq" style="border-radius:var(--radius-xs)"></div>xs · 2</div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-sm)"></div>sm · 4</div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-md)"></div>md · 8</div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-lg)"></div>lg · 12</div>
    <div class="b"><div class="sq" style="border-radius:var(--radius-pill);width:96px"></div>pill</div>
  </div>
</body></html>
