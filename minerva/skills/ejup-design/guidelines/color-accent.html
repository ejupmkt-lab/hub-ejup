<!-- @dsCard group="Colors" viewport="700x150" name="Accent · Gold & Bronze" subtitle="The two warm MIV tones, used sparingly" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff}
  .row{display:flex;gap:0;height:150px}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
  .sw .n{font-size:13px;font-weight:700}
  .sw .h{font-size:11px;letter-spacing:.06em;opacity:.85;margin-top:2px}
  .dark{color:#031c37} .light{color:#fff}
</style></head>
<body>
  <div class="row">
    <div class="sw dark" style="background:var(--ejup-gold)"><span class="n">Dourado</span><span class="h">#F0B855 · accent</span></div>
    <div class="sw light" style="background:var(--ejup-bronze)"><span class="n">Bronze</span><span class="h">#9B6B26 · hover / atenção</span></div>
  </div>
</body></html>
