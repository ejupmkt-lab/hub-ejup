<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff}
  .row{display:flex;gap:0;height:150px}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
  .sw .n{font-size:13px;font-weight:700}
  .sw .h{font-size:11px;letter-spacing:.06em;opacity:.8;margin-top:2px}
  .light{color:#fff}
</style></head>
<body>
  <div class="row">
    <div class="sw light" style="background:var(--ejup-navy)"><span class="n">Azul EJUP</span><span class="h">#031C37 · primary</span></div>
    <div class="sw light" style="background:var(--ejup-ink)"><span class="n">Tinta</span><span class="h">#0D131A · ink</span></div>
    <div class="sw light" style="background:var(--ejup-steel)"><span class="n">Aço</span><span class="h">#304557 · secondary</span></div>
  </div>
</body></html>
