<!-- @dsCard group="Colors" viewport="700x150" name="Estados funcionais" subtitle="Mapeados sobre cores reais do MIV (sem verde/vermelho)" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:18px 20px;box-sizing:border-box}
  .row{display:flex;gap:14px;align-items:stretch}
  .sw{flex:1;border-radius:var(--radius-sm);padding:14px 16px;color:#fff;display:flex;flex-direction:column;justify-content:space-between}
  .sw .n{font-size:13px;font-weight:700}
  .sw .h{font-size:10px;letter-spacing:.04em;opacity:.9;margin-top:8px}
  .note{font-size:11px;color:var(--text-muted);margin-top:12px;line-height:1.5}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--state-info)"><div class="n">Info</div><div class="h">#304557 · aço</div></div>
    <div class="sw" style="background:var(--state-attention)"><div class="n">Atenção / erro</div><div class="h">#9B6B26 · bronze</div></div>
  </div>
  <p class="note">O MIV não define cores de status (verde/vermelho). Estados usam apenas cores da paleta: aço para informação, bronze para atenção/erro.</p>
</body></html>
