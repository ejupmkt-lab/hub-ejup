<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff}
  .row{display:flex;gap:0;height:150px}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
  .sw .n{font-size:12px;font-weight:700}
  .sw .h{font-size:10px;letter-spacing:.04em;opacity:.8;margin-top:2px}
  .dark{color:#0d131a} .light{color:#fff}
</style></head>
<body>
  <div class="row">
    <div class="sw dark" style="background:var(--ejup-silver)"><span class="n">Prata</span><span class="h">#D1D3D4 · K20</span></div>
    <div class="sw light" style="background:var(--ejup-gray)"><span class="n">Cinza</span><span class="h">#5F6062 · K77</span></div>
    <div class="sw light" style="background:var(--ejup-graphite)"><span class="n">Grafite</span><span class="h">#414042 · K90</span></div>
  </div>
</body></html>
