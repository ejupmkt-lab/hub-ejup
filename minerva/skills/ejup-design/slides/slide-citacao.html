<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  .slide{width:1280px;height:720px;background:var(--ejup-steel);color:#fff;font-family:var(--font-sans);padding:96px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;position:relative}
  .mark{font-size:160px;font-weight:900;color:var(--ejup-gold);line-height:.6;height:70px}
  blockquote{font-size:46px;font-weight:300;line-height:1.3;margin:0;max-width:920px;letter-spacing:-.01em}
  blockquote b{font-weight:700;color:var(--ejup-gold)}
  .by{font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-top:44px}
</style></head>
<body>
  <div class="slide">
    <div class="mark">"</div>
    <blockquote>Para permanecer visível, o jurista sério não precisa aderir ao ruído. A EJUP existe para mostrar que <b>profundidade é vantagem</b>, não obstáculo.</blockquote>
    <div class="by">Manifesto EJUP · O herói da profundidade consciente</div>
  </div>
</body></html>
