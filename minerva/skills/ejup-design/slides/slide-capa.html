<!-- @dsCard group="Slides" viewport="1280x720" name="Capa" subtitle="Title slide — dark institutional" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  .slide{width:1280px;height:720px;background:linear-gradient(160deg,#031c37,#0d131a);color:#fff;font-family:var(--font-sans);padding:88px 96px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
  .eb{font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--ejup-gold)}
  h1{font-size:88px;font-weight:900;line-height:1.02;letter-spacing:-.02em;margin:28px 0 0}
  .sub{font-size:22px;font-weight:300;color:rgba(255,255,255,.72);max-width:620px;margin-top:28px;line-height:1.5}
  img.logo{height:40px;position:absolute;top:64px;left:96px}
  .brandmark{position:absolute;right:-90px;top:50%;transform:translateY(-50%);height:680px;width:auto;opacity:.10}
</style></head>
<body>
  <div class="slide">
    <img class="logo" src="../assets/logo/ejup-horizontal-white.svg" alt="ejup — Educação Jurídica">
    <img class="brandmark" src="../assets/logo/ejup-symbol-gold.svg" alt="" aria-hidden="true">
    <div class="eb">Escola Jurídica · 2026</div>
    <h1>Alma clássica,<br>repertório<br>contemporâneo.</h1>
    <div class="sub">Tradição reinterpretada para a era digital — sem perda de densidade, rigor ou legitimidade.</div>
  </div>
</body></html>
