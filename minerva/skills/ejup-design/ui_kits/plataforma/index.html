<!-- @dsCard group="Plataforma" viewport="1280x800" name="Área do aluno" subtitle="Dashboard + player de aula" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>EJUP — Área do aluno</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;height:100%;background:var(--surface-muted);font-family:var(--font-sans);color:var(--text-body)}*{box-sizing:border-box}#root,.shell{height:100vh}</style></head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="Dashboard.jsx"></script>
  <script type="text/babel" src="Lesson.jsx"></script>
  <script type="text/babel">
    function App(){
      const [nav,setNav] = React.useState("Painel");
      const [view,setView] = React.useState("dash");
      return (<div className="shell" style={{display:'flex'}}>
        <AppSidebar active={nav} onNav={(n)=>{setNav(n);setView('dash');}} />
        {view==='dash'
          ? <AppDashboard onOpenLesson={()=>setView('lesson')} />
          : <AppLesson onBack={()=>setView('dash')} />}
      </div>);
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body></html>
