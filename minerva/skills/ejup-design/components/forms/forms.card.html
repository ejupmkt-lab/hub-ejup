<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:#fff;padding:22px 24px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;max-width:600px}
  .stack{display:flex;flex-direction:column;gap:14px}
</style></head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Input, Select, Checkbox, Switch } = window.EJUPDesignSystem_063f43;
    function Demo(){
      const [ok,setOk] = React.useState(true);
      const [on,setOn] = React.useState(true);
      return (<div className="grid">
        <Input label="E-mail" type="email" placeholder="voce@exemplo.com" helper="Usamos para o seu acesso." />
        <Select label="Área de interesse" options={["Constitucional","Penal","Tributário","Trabalhista"]} />
        <Input label="CPF" defaultValue="" error="Campo obrigatório." />
        <div className="stack" style={{justifyContent:'center'}}>
          <Checkbox label="Aceito os termos de uso" checked={ok} onChange={e=>setOk(e.target.checked)} />
          <Switch label="Receber novidades" checked={on} onChange={setOn} />
        </div>
      </div>);
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body></html>
