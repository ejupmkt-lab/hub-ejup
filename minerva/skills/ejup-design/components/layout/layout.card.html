<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface-muted);padding:22px 24px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
</style></head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Card, Tabs, Callout, Eyebrow, Badge } = window.EJUPDesignSystem_063f43;
    function Demo(){
      const [tab,setTab] = React.useState("Visão geral");
      return (<div>
        <Tabs tabs={["Visão geral","Grade","Professores"]} value={tab} onChange={setTab} style={{background:'#fff',padding:'0 16px',borderRadius:'8px 8px 0 0'}}/>
        <div className="row">
          <Card tone="light" elevation="md">
            <Eyebrow>Curso · OAB</Eyebrow>
            <h3 style={{margin:'8px 0 6px',fontSize:18,color:'var(--text-heading)'}}>Direito Constitucional</h3>
            <p style={{margin:0,fontSize:13,lineHeight:1.6,color:'var(--text-muted)'}}>Fundamentos e jurisprudência aplicada, com profundidade.</p>
          </Card>
          <Card tone="dark">
            <Eyebrow tone="onDark">Institucional</Eyebrow>
            <h3 style={{margin:'8px 0 6px',fontSize:18}}>Autoridade silenciosa</h3>
            <p style={{margin:0,fontSize:13,lineHeight:1.6,color:'var(--text-on-dark-muted)'}}>Painel em aço, para contextos institucionais.</p>
          </Card>
        </div>
        <div style={{marginTop:16}}>
          <Callout tone="gold" title="Matrículas abertas">Inscrições até 30 de junho. Vagas limitadas por turma.</Callout>
        </div>
      </div>);
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body></html>
