<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0}
  .tile{width:1280px;height:854px;display:flex;font-family:var(--font-sans)}
  .main{flex:0 0 75%;background:var(--ejup-navy);display:flex;align-items:center;justify-content:center}
  .main img{width:62%;height:auto}
  .strip{flex:1;display:flex;flex-direction:column}
  .strip div{flex:1}
</style></head>
<body>
  <div class="tile">
    <div class="main"><img src="assets/logo/ejup-horizontal-white.svg" alt="EJUP"></div>
    <div class="strip">
      <div style="background:var(--ejup-gold)"></div>
      <div style="background:var(--ejup-bronze)"></div>
      <div style="background:var(--ejup-steel)"></div>
      <div style="background:var(--ejup-ink)"></div>
    </div>
  </div>
</body></html>
