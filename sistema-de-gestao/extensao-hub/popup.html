<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blimp: ler esta página do HUB</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; width: 340px; color: #14213d; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p { margin: 0 0 10px; color: #4a5568; }
    button { padding: 9px 14px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { background: #9fb3e8; cursor: default; }
    button.sec { background: #eef1f6; color: #14213d; margin-top: 6px; }
    #ler { width: 100%; font-size: 15px; padding: 11px 14px; }
    #estado { margin: 10px 0 0; font-weight: 600; }
    .erro { color: #b91c1c; }
    .ok { color: #15803d; }
    ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: #4a5568; }
    a { color: #1d4ed8; }
    footer { margin-top: 12px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Ler esta página do HUB</h1>
  <p id="onde">Verificando…</p>
  <button id="ler" disabled>Ler agora</button>
  <label style="display:flex;gap:8px;align-items:flex-start;margin:10px 0 0;font-size:13px">
    <input type="checkbox" id="clicar" checked style="margin-top:3px" />
    <span>Clicar nos botões de download de cada etapa e documento para baixar os arquivos. Só clica em botões de baixar; nunca em enviar, excluir ou editar.</span>
  </label>
  <label style="display:flex;gap:8px;align-items:flex-start;margin:10px 0 0;font-size:13px">
    <input type="checkbox" id="real" style="margin-top:3px" />
    <span>Mouse de verdade: passa o mouse e clica como uma pessoa. Use se os nomes dos envolvidos ou os relatórios não vierem. O navegador avisa que está “depurando” a aba enquanto lê.</span>
  </label>
  <div style="margin-top:14px;padding-top:12px;border-top:1px solid #e2e8f0">
    <p id="ondeLote" style="margin-bottom:6px">Na lista de projetos do HUB, leio todos os pedidos de uma vez.</p>
    <button id="lote" class="sec" style="margin-top:0;width:100%" disabled>Ler todos os projetos da lista</button>
    <button id="parar" class="sec" style="display:none;width:100%">Parar depois do pedido atual</button>
  </div>
  <p id="estado" role="status"></p>
  <ul id="detalhes"></ul>
  <div id="acoes"></div>
  <footer><a href="#" id="opcoes">Opções</a> · lê só quando você clica, não guarda senha</footer>
  <script src="popup.js"></script>
</body>
</html>
