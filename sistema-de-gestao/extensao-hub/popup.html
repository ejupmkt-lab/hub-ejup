<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blimp: ler esta página do HUB</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; width: 340px; color: #14213d; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p { margin: 0 0 10px; color: #4a5568; }
    button { padding: 9px 14px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { background: #9fb3e8; cursor: default; }
    button.sec { background: #eef1f6; color: #14213d; margin-top: 6px; }
    #ler { width: 100%; font-size: 15px; padding: 11px 14px; }
    #estado { margin: 10px 0 0; font-weight: 600; }
    .erro { color: #b91c1c; }
    .ok { color: #15803d; }
    ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: #4a5568; }
    a { color: #1d4ed8; }
    footer { margin-top: 12px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Ler esta página do HUB</h1>
  <p id="onde">Verificando…</p>
  <button id="ler" disabled>Ler agora</button>
  <p id="estado" role="status"></p>
  <ul id="detalhes"></ul>
  <div id="acoes"></div>
  <footer><a href="#" id="opcoes">Opções</a> · lê só quando você clica, não guarda senha</footer>
  <script src="popup.js"></script>
</body>
</html>
