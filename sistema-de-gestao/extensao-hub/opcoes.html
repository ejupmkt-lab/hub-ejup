<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blimp: importar do HUB</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 20px; min-width: 340px; max-width: 520px; color: #14213d; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { margin: 0 0 12px; color: #4a5568; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #c8d0dc; border-radius: 8px; font: inherit; }
    button { margin-top: 10px; padding: 8px 14px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button.sec { background: #eef1f6; color: #14213d; margin-left: 6px; }
    ul { padding-left: 18px; margin: 8px 0; }
    #msg { margin-top: 12px; font-weight: 600; }
    .erro { color: #b91c1c; }
    .ok { color: #15803d; }
  </style>
</head>
<body>
  <h1>Blimp: importar do HUB</h1>
  <p>Informe o endereço do HUB SEBRAE e permita a leitura. Depois, no Blimp, é só clicar em "Importar do HUB" com o pedido aberto numa aba do HUB.</p>
  <label for="endereco">Endereço do HUB</label>
  <input id="endereco" placeholder="https://… (copie da barra de endereço do HUB)" inputmode="url" />
  <button id="permitir">Permitir a leitura deste site</button>
  <p id="msg" role="status"></p>
  <p><strong>Sites permitidos</strong></p>
  <ul id="lista"></ul>
  <p>A extensão só lê a aba do HUB quando o Blimp pede. Ela não guarda senha nem envia nada sozinha.</p>
  <script src="opcoes.js"></script>
</body>
</html>
